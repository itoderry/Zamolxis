<!doctype html><html><head><meta charset="utf-8">
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a; --txt:#e6e9ef;
  --muted:#9aa3b2; --accent:#4c8dff; --accent2:#2f6fe0; --ok:#3fb950; --warn:#e3a008; --bad:#f85149;
  --chip:#222733;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f6fa; --panel:#ffffff; --panel2:#f0f2f7; --line:#e2e6ee; --txt:#1b1f27;
         --muted:#5c6573; --chip:#eef1f6; }
}
/* Manual theme override (Settings > Theme). data-theme is absent for "auto". */
html[data-theme="dark"]{ --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a; --txt:#e6e9ef;
  --muted:#9aa3b2; --chip:#222733; }
html[data-theme="light"]{ --bg:#f4f6fa; --panel:#ffffff; --panel2:#f0f2f7; --line:#e2e6ee; --txt:#1b1f27;
  --muted:#5c6573; --chip:#eef1f6; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--txt);
  font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden}
header{flex:0 0 auto;padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;background:var(--panel)}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.sub{color:var(--muted);font-size:12px}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);
  padding:8px 14px;border-radius:8px;cursor:pointer;transition:.12s}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent2)}
select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);padding:6px 10px;border-radius:8px}
.tabs{flex:0 0 auto;display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.tab{padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-size:13px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--txt);border-bottom-color:var(--accent)}
.tab .badge{display:inline-block;min-width:18px;text-align:center;margin-left:6px;padding:0 6px;
  border-radius:10px;background:var(--chip);font-size:11px;color:var(--muted)}
.tab .badge.hot{background:var(--warn);color:#1b1f27;font-weight:700}
.catbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bkhelp{margin:8px 0 12px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--panel2)}
.bkhelp summary{cursor:pointer;color:var(--accent);font-weight:600}
.bkhelp .bkbody{padding-top:6px;line-height:1.5}
.bkhelp p{margin:6px 0}
.twrow{display:flex;gap:14px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line)}
.twrow .twtxt{flex:1}
.tgl{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto;margin-top:2px}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl .tgls{position:absolute;inset:0;background:var(--chip);border:1px solid var(--line);border-radius:24px;transition:.15s;cursor:pointer}
.tgl .tgls:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.tgl input:checked + .tgls{background:var(--accent);border-color:var(--accent)}
.tgl input:checked + .tgls:before{transform:translateX(18px)}
.dbwarn{border-color:var(--warn)!important;background:rgba(227,160,8,.10)}
button.dngr{background:var(--bad);border-color:var(--bad);color:#fff}
.catpill{padding:9px 20px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;display:flex;align-items:center;gap:8px}
.catpill:hover{color:var(--txt);background:var(--panel2)}
.catpill.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.catpill .b{min-width:18px;text-align:center;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.25);font-size:11px;font-weight:700}
.catpill.active .b{background:rgba(255,255,255,.25)}
.catpill .b.hot{background:var(--warn);color:#1b1f27}
.catspacer{flex:1 1 auto}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 14px;flex-wrap:wrap}
.subtab{padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-size:13px}
.subtab:hover{color:var(--txt)}
.subtab.active{color:var(--txt);border-bottom-color:var(--accent)}
.loading{display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px 20px;color:var(--muted)}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
.runspin{display:inline-block;width:11px;height:11px;margin-left:7px;vertical-align:-1px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.catpill:not(.active) .runspin{border-color:var(--line);border-top-color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.dupthumb{object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:transform .08s}
.dupthumb:hover{transform:scale(1.03);border-color:var(--accent)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999}
.lightbox img{max-width:94vw;max-height:94vh;object-fit:contain;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.lbclose{position:absolute;top:10px;right:22px;font-size:42px;line-height:1;color:#fff;cursor:pointer;font-weight:300}
.lbclose:hover{color:var(--accent)}
.lbspin{color:#cfd6e4;font-family:Consolas,monospace}
.twgrp{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel)}
.twgrp>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;list-style:none;user-select:none}
.twgrp>summary::-webkit-details-marker{display:none}
.twgrp>summary::before{content:"\25B8";display:inline-block;margin-right:8px;color:var(--muted);transition:transform .12s}
.twgrp[open]>summary::before{transform:rotate(90deg)}
.twgrp>.twrow{padding-left:14px;padding-right:14px}
.dupgrp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.dupfile{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.dupfile .p{flex:1 1 auto;word-break:break-all;color:var(--muted)}
main{flex:1 1 auto;overflow:auto;padding:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .k{color:var(--muted);font-size:12px}.card .v{font-size:24px;font-weight:700;margin-top:4px}
.card .v.hot{color:var(--warn)} .card .v.good{color:var(--ok)}
.kv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;line-height:1.9}
.kv b{color:var(--muted);font-weight:600;display:inline-block;min-width:120px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel2);color:var(--muted);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill.up{background:rgba(227,160,8,.16);color:var(--warn)}
.pill.ok{background:rgba(63,185,80,.16);color:var(--ok)}
.pill.mut{background:var(--chip);color:var(--muted)}
.pill.bad{background:rgba(248,81,73,.16);color:var(--bad)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.empty{color:var(--muted);padding:30px;text-align:center}
.statusbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 18px;
  border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.bar{flex:1 1 auto;height:6px;background:var(--chip);border-radius:4px;overflow:hidden;display:none}
.bar > i{display:block;height:100%;width:0;background:var(--accent);transition:.2s}
.log{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-family:Consolas,monospace;font-size:12px;height:320px;overflow:auto;white-space:pre-wrap;color:#cfd6e4}
.opt{display:flex;align-items:center;gap:10px;margin:10px 0}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:8px;padding:12px 14px;color:var(--muted);margin-bottom:14px}
.rec{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:10px 14px;margin:8px 0;color:var(--txt)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
h3{margin:6px 0 10px}
</style></head>
<body>

<main id="main"></main>
<div class="statusbar">
  <span id="status"></span>
  <span class="bar" id="bar"><i id="barfill"></i></span>
</div>

const $=id=>document.getElementById(id);
function send(o){ window.chrome.webview.postMessage(o); }
function setStatus(s){ $("status").textContent=s||""; }
function showBar(on){ $("bar").style.display=on?"block":"none"; if(!on)$("barfill").style.width="0"; }
function esc(s){ return (s==null?"":""+s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function link(url,txt){ return url?'<a href="#" onclick="send({cmd:\'open\',url:\''+(""+url).replace(/'/g,"%27")+'\'});return false">'+esc(txt||url)+'</a>':esc(txt||""); }
function spinner(text){ return '<div class="loading"><div class="spin"></div><div class="sub">'+esc(text||"")+'</div></div>'; }
function catBusy(c){ for(const op in running) if(running[op]&&OPCAT[op]===c) return true; return false; }
function startOp(op,text){ running[op]=true; const c=OPCAT[op]; if(text!=null)catStatus[c]=text; if(c===cat){setStatus(catStatus[c]);showBar(true);} buildCatBar(); }
function endOp(op,text){ running[op]=false; const c=OPCAT[op]; if(text!=null)catStatus[c]=text; if(c===cat){setStatus(catStatus[c]||t("st_idle"));showBar(catBusy(c));} buildCatBar(); }
// auto-trigger an op the first time its view opens; returns true while loading
function autorun(op,cmd,data){ if(data!=null) return false; if(!running[op]){ startOp(op,t("st_working")); send({cmd:cmd}); } return true; }
function go(c){ cat=c; setStatus(catStatus[c]||t("st_idle")); showBar(catBusy(c)); render(); }

function buildCatBar(){
  const c=$("catbar"); if(!c) return;   // native menu bar is the nav now; no pill row
  c.innerHTML="";
  const updN=scan?scan.drivers.filter(x=>x.verdict==="UPDATE AVAILABLE").length:0;
  const sysN=sysData?((sysData.alerts||[]).length+(sysData.disks||[]).length):0;
  for(const [id,key] of CATS){
    let b=''; if(id==="drivers"&&updN) b='<span class="b hot">'+updN+'</span>';
    if(id==="system"&&sysN) b='<span class="b hot">'+sysN+'</span>';
    if(catBusy(id)) b+='<span class="runspin"></span>';
    const el=document.createElement("div"); el.className="catpill"+(id===cat?" active":"");
    el.innerHTML=esc(t(key))+b; el.onclick=(function(x){return function(){go(x);};})(id);
    c.appendChild(el);
  }
}

function fmtSize(kb){ if(!kb||kb<=0)return ""; if(kb>=1048576)return (kb/1048576).toFixed(1)+" GB"; if(kb>=1024)return (kb/1024).toFixed(0)+" MB"; return kb+" KB"; }

function healthColor(sev){ return sev==="red"?"#f85149":sev==="orange"?"#d29922":"#3fb950"; }
function hfText(f,which){
  let s=t("hf_"+f.id+"_"+which)||"";
  return s.replace("{drive}",f.drive!=null?f.drive:"").replace("{gb}",f.gb!=null?f.gb:"")
          .replace("{pct}",f.pct!=null?f.pct:"").replace("{n}",f.n!=null?f.n:"").replace("{av}",f.av!=null?f.av:"");
}
function healthAct(i){
  const f=healthData.findings[i]; if(!f) return;
  if(f.fix) send({cmd:f.fix});
  if(f.cat){ cat=f.cat; if(f.sub){ if(f.cat==="system")sysSub=f.sub; else if(f.cat==="network")netSub=f.sub; else drvSub=f.sub; } go(f.cat); }
}
function hfCard(f,i){
  const c=healthColor(f.sev), title=hfText(f,"t"), detail=hfText(f,"d");
  let btn=""; if(f.sev!=="green"&&(f.cat||f.fix)) btn='<button '+(f.fix?'class="primary" ':'')+'onclick="healthAct('+i+')">'+esc(t(f.fix?"h_fix":"h_showme"))+'</button>';
  return '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px">'
    +'<div style="flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:'+c+';margin-top:5px"></div>'
    +'<div style="flex:1 1 auto;min-width:0"><div style="font-weight:600">'+esc(title)+'</div><div class="sub">'+esc(detail)+'</div></div>'
    +(btn?'<div style="flex:0 0 auto">'+btn+'</div>':'')+'</div>';
}
function viewHealth(){
  let h='<div class="toolbar"><button class="primary" onclick="healthData=null;startOp(\'health\',t(\'h_scanning\'));send({cmd:\'health\'});render()">'+esc(t(healthData?"h_recheck":"h_check"))+'</button><span class="sub">'+esc(t("h_intro"))+'</span></div>';
  if(!healthData){ autorun('health','health',healthData); return h+spinner(t("h_scanning")); }
  const d=healthData, col=healthColor(d.grade==="good"?"green":d.grade==="fair"?"orange":"red"), deg=Math.round((d.score/100)*360);
  h+='<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:6px 0 14px">'
    +'<div style="width:120px;height:120px;border-radius:50%;background:conic-gradient('+col+' '+deg+'deg,var(--line) 0);display:flex;align-items:center;justify-content:center;flex:0 0 auto">'
    +'<div style="width:92px;height:92px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center">'
    +'<div style="font-size:30px;font-weight:700;color:'+col+';line-height:1">'+d.score+'</div><div class="sub" style="font-size:11px">/ 100</div></div></div>'
    +'<div><div style="font-size:20px;font-weight:700;color:'+col+'">'+esc(t("h_grade_"+d.grade))+'</div><div class="sub">'+esc(t("h_gradesub_"+d.grade))+'</div></div></div>';
  const fs=d.findings||[], todo=fs.filter(f=>f.sev!=="green"), ok=fs.filter(f=>f.sev==="green");
  if(todo.length){ h+='<h3 style="margin:10px 0 6px">'+esc(t("h_todo"))+'</h3>'; todo.forEach(f=>{ h+=hfCard(f,fs.indexOf(f)); }); }
  else h+='<div class="empty" style="color:#3fb950">'+esc(t("h_allgood"))+'</div>';
  if(ok.length){ h+='<h3 style="margin:16px 0 6px">'+esc(t("h_whatsok"))+'</h3>'; ok.forEach(f=>{ h+=hfCard(f,fs.indexOf(f)); }); }
  return h;
}

{id:"officecursorlag",t:{en:["Fix Office cursor lag","Disable Office animations that cause typing lag."],fr:["Corriger le lag du curseur Office","Désactiver les animations Office qui ralentissent la frappe."],de:["Office-Cursor-Lag beheben","Office-Animationen deaktivieren, die Tippverzögerung verursachen."],it:["Risolvi lag cursore Office","Disattiva le animazioni di Office che rallentano la digitazione."],pl:["Napraw lag kursora Office","Wyłącz animacje Office powodujące opóźnienie pisania."],uk:["Виправити лаг курсора Office","Вимкнути анімації Office, що сповільнюють набір."],es:["Arreglar lag del cursor de Office","Desactivar las animaciones de Office que retrasan la escritura."],pt:["Corrigir lag do cursor do Office","Desativar as animações do Office que atrasam a escrita."],ro:["Repară lag-ul cursorului Office","Dezactivează animațiile Office care încetinesc tastarea."]}},
{id:"fgboost",t:{en:["Boost foreground apps","Give the active window more CPU priority (Win32PrioritySeparation)."],fr:["Prioriser l'app au premier plan","Donner plus de priorité CPU à la fenêtre active."],de:["Vordergrund-Apps bevorzugen","Dem aktiven Fenster mehr CPU-Priorität geben."],it:["Priorità alle app in primo piano","Dai più priorità CPU alla finestra attiva."],pl:["Priorytet aplikacji na pierwszym planie","Daj aktywnemu oknu więcej priorytetu CPU."],uk:["Пріоритет активним додаткам","Надати активному вікну більше пріоритету CPU."],es:["Priorizar app en primer plano","Dar más prioridad de CPU a la ventana activa."],pt:["Priorizar app em primeiro plano","Dar mais prioridade de CPU à janela ativa."],ro:["Prioritate aplicației active","Oferă ferestrei active mai multă prioritate CPU."]}},
{id:"startupdelay",t:{en:["Remove startup app delay","Launch startup apps immediately at login (no ~10s delay)."],fr:["Supprimer le délai de démarrage","Lancer les apps de démarrage immédiatement (sans délai ~10s)."],de:["Startverzögerung entfernen","Autostart-Apps sofort bei Anmeldung starten (kein ~10s-Delay)."],it:["Rimuovi il ritardo all'avvio","Avvia subito le app di avvio all'accesso (niente ~10s)."],pl:["Usuń opóźnienie autostartu","Uruchamiaj aplikacje autostartu od razu (bez ~10s)."],uk:["Прибрати затримку автозапуску","Запускати програми автозапуску одразу (без ~10с)."],es:["Quitar retardo de inicio","Iniciar las apps de arranque al instante (sin ~10s)."],pt:["Remover atraso de arranque","Iniciar as apps de arranque de imediato (sem ~10s)."],ro:["Elimină întârzierea la pornire","Pornește aplicațiile de pornire imediat (fără ~10s)."]}},
{id:"stickykeys",t:{en:["Disable Sticky Keys shortcut","Stop the Shift×5 Sticky Keys popup."],fr:["Désactiver le raccourci touches rémanentes","Empêcher la fenêtre Maj×5 des touches rémanentes."],de:["Einrastfunktion-Shortcut aus","Das Umschalt×5-Popup der Einrastfunktion verhindern."],it:["Disattiva scorciatoia tasti permanenti","Blocca il popup Maiusc×5 dei tasti permanenti."],pl:["Wyłącz skrót klawiszy trwałych","Zablokuj okienko Shift×5 klawiszy trwałych."],uk:["Вимкнути ярлик залипання клавіш","Прибрати вікно Shift×5 залипання клавіш."],es:["Desactivar atajo teclas especiales","Evitar la ventana Mayús×5 de teclas especiales."],pt:["Desativar atalho de teclas fixas","Impedir a janela Shift×5 das teclas fixas."],ro:["Dezactivează scurtătura StickyKeys","Oprește fereastra Shift×5 a tastelor adezive."]}},
{id:"mpo",t:{en:["Disable MPO (fix flicker)","Turn off multi-plane overlay - fixes flicker/black-screen on some GPUs."],fr:["Désactiver MPO (corrige le scintillement)","Désactive l'overlay multi-plan - corrige scintillement/écran noir sur certains GPU."],de:["MPO deaktivieren (Flackern beheben)","Multiplane-Overlay aus - behebt Flackern/Schwarzbild auf manchen GPUs."],it:["Disattiva MPO (corregge sfarfallio)","Disattiva il multiplane overlay - risolve sfarfallio/schermo nero su alcune GPU."],pl:["Wyłącz MPO (napraw migotanie)","Wyłącz multiplane overlay - naprawia migotanie/czarny ekran na części GPU."],uk:["Вимкнути MPO (виправити мерехтіння)","Вимкнути multiplane overlay - виправляє мерехтіння/чорний екран на деяких GPU."],es:["Desactivar MPO (arregla parpadeo)","Desactiva el multiplane overlay - corrige parpadeo/pantalla negra en algunas GPU."],pt:["Desativar MPO (corrige cintilação)","Desativa o multiplane overlay - corrige cintilação/ecrã preto em algumas GPU."],ro:["Dezactivează MPO (repară pâlpâirea)","Dezactivează multiplane overlay - repară pâlpâirea/ecranul negru pe unele GPU."]}}
,
{id:"errorreporting",t:{en:["Disable error reporting","Stop sending crash and error reports to Microsoft."],fr:["Desactiver les rapports d'erreurs","Arreter d'envoyer les rapports d'incidents et d'erreurs a Microsoft."],de:["Fehlerberichterstattung deaktivieren","Senden von Absturz- und Fehlerberichten an Microsoft beenden."],it:["Disabilita segnalazione errori","Smetti di inviare segnalazioni di arresti anomali ed errori a Microsoft."],pl:["Wylacz raportowanie bledow","Zatrzymaj wysylanie raportow o awariach i bledach do Microsoft."],uk:["Вимкнути звіти про помилки","Припинити надсилання звітів про збої та помилки до Microsoft."],es:["Desactivar informe de errores","Dejar de enviar informes de fallos y errores a Microsoft."],pt:["Desativar relatorios de erros","Parar de enviar relatorios de falhas e erros para a Microsoft."],ro:["Dezactiveaza raportarea erorilor","Opreste trimiterea rapoartelor de blocare si eroare catre Microsoft."]}},
{id:"remoteassist",t:{en:["Disable Remote Assistance","Stop others remotely connecting to help with your PC."],fr:["Desactiver l'Assistance a distance","Empecher autrui de se connecter a distance pour depanner votre PC."],de:["Remoteunterstutzung deaktivieren","Verhindern, dass andere sich per Fernzugriff mit Ihrem PC verbinden."],it:["Disabilita Assistenza remota","Impedisci ad altri di connettersi da remoto al tuo PC."],pl:["Wylacz Pomoc zdalna","Zablokuj zdalne laczenie sie innych osob z Twoim komputerem."],uk:["Вимкнути віддалену допомогу","Заборонити іншим віддалено підключатися для допомоги з вашим ПК."],es:["Desactivar Asistencia remota","Impedir que otros se conecten de forma remota a tu PC."],pt:["Desativar Assistencia Remota","Impedir que outros se liguem remotamente ao seu PC."],ro:["Dezactiveaza Asistenta la distanta","Impiedica conectarea altora de la distanta la PC-ul tau."]}},
{id:"contentdelivery",t:{en:["Disable content delivery","Master switch off for Microsoft-pushed content and suggestions."],fr:["Desactiver la diffusion de contenu","Interrupteur principal pour le contenu et les suggestions pousses par Microsoft."],de:["Inhaltsubermittlung deaktivieren","Hauptschalter aus fur von Microsoft bereitgestellte Inhalte und Vorschlage."],it:["Disabilita distribuzione contenuti","Interruttore principale per contenuti e suggerimenti inviati da Microsoft."],pl:["Wylacz dostarczanie tresci","Glowny wylacznik tresci i sugestii przesylanych przez Microsoft."],uk:["Вимкнути доставку вмісту","Головний вимикач для вмісту та пропозицій, що надсилаються Microsoft."],es:["Desactivar entrega de contenido","Interruptor principal del contenido y sugerencias enviados por Microsoft."],pt:["Desativar entrega de conteudo","Interruptor principal de conteudo e sugestoes enviados pela Microsoft."],ro:["Dezactiveaza livrarea de continut","Comutator principal pentru continutul si sugestiile trimise de Microsoft."]}},
{id:"silentapps",t:{en:["Stop silent app installs","Stop Windows silently installing suggested apps in the background."],fr:["Arreter les installations silencieuses","Empecher Windows d'installer en arriere-plan les applications suggerees."],de:["Stille App-Installationen stoppen","Windows daran hindern, vorgeschlagene Apps im Hintergrund zu installieren."],it:["Blocca installazioni silenziose","Impedisci a Windows di installare app suggerite in background."],pl:["Zatrzymaj ciche instalacje aplikacji","Zablokuj ciche instalowanie sugerowanych aplikacji w tle przez Windows."],uk:["Зупинити тихе встановлення додатків","Припинити фонове встановлення Windows запропонованих додатків."],es:["Detener instalaciones silenciosas","Impedir que Windows instale apps sugeridas en segundo plano."],pt:["Parar instalacoes silenciosas","Impedir que o Windows instale apps sugeridos em segundo plano."],ro:["Opreste instalarile silentioase","Impiedica Windows sa instaleze aplicatii sugerate in fundal."]}},
{id:"oemapps",t:{en:["Block OEM promo apps","Stop your PC maker pre-loading promotional apps."],fr:["Bloquer les applis promo OEM","Empecher le fabricant de votre PC de preinstaller des applications promotionnelles."],de:["OEM-Werbe-Apps blockieren","Verhindern, dass Ihr PC-Hersteller Werbe-Apps vorinstalliert."],it:["Blocca app promozionali OEM","Impedisci al produttore del PC di precaricare app promozionali."],pl:["Blokuj aplikacje promocyjne OEM","Zablokuj preinstalowanie aplikacji promocyjnych przez producenta komputera."],uk:["Блокувати рекламні додатки OEM","Заборонити виробнику ПК попередньо встановлювати рекламні додатки."],es:["Bloquear apps promocionales OEM","Impedir que el fabricante de tu PC preinstale apps promocionales."],pt:["Bloquear apps promocionais OEM","Impedir que o fabricante do seu PC pre-instale apps promocionais."],ro:["Blocheaza aplicatiile promo OEM","Impiedica producatorul PC-ului sa preinstaleze aplicatii promotionale."]}},
{id:"softlanding",t:{en:["Disable feature tips","Stop promotional tip overlays for Windows features."],fr:["Desactiver les conseils de fonctionnalites","Supprimer les conseils promotionnels superposes pour les fonctionnalites Windows."],de:["Funktionstipps deaktivieren","Werbliche Tipp-Einblendungen fur Windows-Funktionen beenden."],it:["Disabilita suggerimenti funzioni","Elimina i suggerimenti promozionali sovrapposti per le funzionalita di Windows."],pl:["Wylacz porady o funkcjach","Wylacz promocyjne nakladki z poradami dotyczacymi funkcji Windows."],uk:["Вимкнути підказки про функції","Прибрати рекламні підказки про функції Windows."],es:["Desactivar consejos de funciones","Eliminar los consejos promocionales superpuestos de funciones de Windows."],pt:["Desativar dicas de recursos","Remover as dicas promocionais sobrepostas dos recursos do Windows."],ro:["Dezactiveaza sfaturile despre functii","Elimina sfaturile promotionale suprapuse pentru functiile Windows."]}},
{id:"onlinespeech",t:{en:["Disable online speech","Stop sending your voice to Microsoft for cloud speech recognition."],fr:["Desactiver la reconnaissance vocale en ligne","Arreter d'envoyer votre voix a Microsoft pour la reconnaissance vocale dans le cloud."],de:["Onlinespracherkennung deaktivieren","Senden Ihrer Stimme an Microsoft fur die Cloud-Spracherkennung beenden."],it:["Disabilita riconoscimento vocale online","Smetti di inviare la tua voce a Microsoft per il riconoscimento vocale nel cloud."],pl:["Wylacz rozpoznawanie mowy online","Zatrzymaj wysylanie glosu do Microsoft na potrzeby rozpoznawania mowy w chmurze."],uk:["Вимкнути онлайн-розпізнавання мовлення","Припинити надсилання вашого голосу до Microsoft для хмарного розпізнавання мовлення."],es:["Desactivar voz en linea","Dejar de enviar tu voz a Microsoft para el reconocimiento de voz en la nube."],pt:["Desativar voz online","Parar de enviar a sua voz para a Microsoft para reconhecimento de voz na nuvem."],ro:["Dezactiveaza vocea online","Opreste trimiterea vocii catre Microsoft pentru recunoasterea vocala in cloud."]}},
{id:"inkingtyping",t:{en:["Disable typing personalization","Stop Windows profiling your typing and handwriting."],fr:["Desactiver la personnalisation de saisie","Empecher Windows d'analyser votre saisie et votre ecriture manuscrite."],de:["Eingabepersonalisierung deaktivieren","Verhindern, dass Windows Ihre Eingabe und Handschrift profiliert."],it:["Disabilita personalizzazione digitazione","Impedisci a Windows di profilare la tua digitazione e scrittura a mano."],pl:["Wylacz personalizacje pisania","Zablokuj profilowanie pisania i odrecznego pisma przez Windows."],uk:["Вимкнути персоналізацію введення","Припинити профілювання Windows вашого набору тексту та рукописного введення."],es:["Desactivar personalizacion de escritura","Impedir que Windows perfile tu escritura con teclado y a mano."],pt:["Desativar personalizacao de escrita","Impedir que o Windows analise a sua digitacao e escrita manual."],ro:["Dezactiveaza personalizarea scrierii","Impiedica Windows sa-ti analizeze tastarea si scrisul de mana."]}},
{id:"typingdata",t:{en:["Stop sending typing data","Stop sending inking and typing samples to Microsoft."],fr:["Arreter l'envoi des donnees de saisie","Arreter d'envoyer a Microsoft des echantillons d'ecriture manuscrite et de saisie."],de:["Senden von Eingabedaten stoppen","Senden von Freihand- und Eingabebeispielen an Microsoft beenden."],it:["Blocca invio dati di digitazione","Smetti di inviare campioni di scrittura a mano e digitazione a Microsoft."],pl:["Zatrzymaj wysylanie danych pisania","Zatrzymaj wysylanie probek pisma odrecznego i pisania do Microsoft."],uk:["Зупинити надсилання даних про введення","Припинити надсилання зразків рукописного введення та набору тексту до Microsoft."],es:["Detener envio de datos de escritura","Dejar de enviar muestras de escritura manual y con teclado a Microsoft."],pt:["Parar envio de dados de digitacao","Parar de enviar amostras de escrita manual e digitacao para a Microsoft."],ro:["Opreste trimiterea datelor de tastare","Opreste trimiterea mostrelor de scriere de mana si tastare catre Microsoft."]}},
{id:"feedbackreq",t:{en:["Disable feedback requests","Stop Windows asking you for feedback."],fr:["Desactiver les demandes de commentaires","Empecher Windows de vous solliciter pour des commentaires."],de:["Feedbackanfragen deaktivieren","Verhindern, dass Windows Sie um Feedback bittet."],it:["Disabilita richieste di feedback","Impedisci a Windows di chiederti un feedback."],pl:["Wylacz prosby o opinie","Zablokuj proszenie o opinie przez Windows."],uk:["Вимкнути запити відгуків","Припинити запити Windows про надання відгуків."],es:["Desactivar solicitudes de comentarios","Impedir que Windows te pida comentarios."],pt:["Desativar pedidos de feedback","Impedir que o Windows lhe peca feedback."],ro:["Dezactiveaza solicitarile de feedback","Impiedica Windows sa-ti ceara feedback."]}},
{id:"searchhist",t:{en:["Disable device search history","Stop keeping a history of your searches on this device."],fr:["Desactiver l'historique de recherche de l'appareil","Arreter de conserver l'historique de vos recherches sur cet appareil."],de:["Gerate-Suchverlauf deaktivieren","Speichern eines Verlaufs Ihrer Suchvorgange auf diesem Gerat beenden."],it:["Disabilita cronologia ricerche dispositivo","Smetti di conservare la cronologia delle ricerche su questo dispositivo."],pl:["Wylacz historie wyszukiwania urzadzenia","Zatrzymaj przechowywanie historii wyszukiwania na tym urzadzeniu."],uk:["Вимкнути історію пошуку на пристрої","Припинити збереження історії ваших пошуків на цьому пристрої."],es:["Desactivar historial de busqueda del dispositivo","Dejar de guardar el historial de tus busquedas en este dispositivo."],pt:["Desativar historico de pesquisa do dispositivo","Parar de manter um historico das suas pesquisas neste dispositivo."],ro:["Dezactiveaza istoricul de cautare al dispozitivului","Opreste pastrarea unui istoric al cautarilor pe acest dispozitiv."]}},
{id:"searchhighlights",t:{en:["Disable search highlights","Remove trending content from the search box."],fr:["Desactiver les temps forts de la recherche","Supprimer le contenu tendance de la zone de recherche."],de:["Suchhighlights deaktivieren","Trendinhalte aus dem Suchfeld entfernen."],it:["Disabilita elementi in evidenza ricerca","Rimuovi i contenuti di tendenza dalla casella di ricerca."],pl:["Wylacz wyrozznienia wyszukiwania","Usun popularne tresci z pola wyszukiwania."],uk:["Вимкнути основні моменти пошуку","Прибрати популярний вміст із поля пошуку."],es:["Desactivar aspectos destacados de busqueda","Quitar el contenido de tendencia del cuadro de busqueda."],pt:["Desativar destaques de pesquisa","Remover o conteudo em tendencia da caixa de pesquisa."],ro:["Dezactiveaza evidentierile din cautare","Elimina continutul in tendinte din caseta de cautare."]}},
{id:"cloudsearch",t:{en:["Disable cloud search","Stop search including Microsoft and work cloud content."],fr:["Desactiver la recherche dans le cloud","Empecher la recherche d'inclure le contenu cloud Microsoft et professionnel."],de:["Cloudsuche deaktivieren","Verhindern, dass die Suche Microsoft- und Arbeitscloudinhalte einbezieht."],it:["Disabilita ricerca nel cloud","Impedisci alla ricerca di includere contenuti cloud Microsoft e di lavoro."],pl:["Wylacz wyszukiwanie w chmurze","Zablokuj uwzglednianie w wyszukiwaniu tresci chmury Microsoft i sluzbowej."],uk:["Вимкнути хмарний пошук","Припинити включення вмісту з хмари Microsoft і робочої хмари до пошуку."],es:["Desactivar busqueda en la nube","Impedir que la busqueda incluya contenido en la nube de Microsoft y del trabajo."],pt:["Desativar pesquisa na nuvem","Impedir que a pesquisa inclua conteudo na nuvem da Microsoft e do trabalho."],ro:["Dezactiveaza cautarea in cloud","Impiedica cautarea sa includa continut din cloudul Microsoft si de serviciu."]}},
{id:"cortana",t:{en:["Disable Cortana","Turn off the Cortana assistant."],fr:["Desactiver Cortana","Desactiver l'assistant Cortana."],de:["Cortana deaktivieren","Den Cortana-Assistenten ausschalten."],it:["Disabilita Cortana","Disattiva l'assistente Cortana."],pl:["Wylacz Cortane","Wylacz asystenta Cortana."],uk:["Вимкнути Cortana","Вимкнути помічника Cortana."],es:["Desactivar Cortana","Desactivar el asistente Cortana."],pt:["Desativar a Cortana","Desligar o assistente Cortana."],ro:["Dezactiveaza Cortana","Dezactiveaza asistentul Cortana."]}},
{id:"cameraaccess",t:{en:["Block app camera access","Deny apps access to your camera."],fr:["Bloquer l'acces des applis a la camera","Refuser aux applications l'acces a votre camera."],de:["App-Kamerazugriff blockieren","Apps den Zugriff auf Ihre Kamera verweigern."],it:["Blocca accesso fotocamera alle app","Nega alle app l'accesso alla fotocamera."],pl:["Blokuj dostep aplikacji do kamery","Odmow aplikacjom dostepu do kamery."],uk:["Заблокувати доступ додатків до камери","Заборонити додаткам доступ до вашої камери."],es:["Bloquear acceso de apps a la camara","Denegar a las apps el acceso a tu camara."],pt:["Bloquear acesso das apps a camara","Negar as apps o acesso a sua camara."],ro:["Blocheaza accesul aplicatiilor la camera","Refuza aplicatiilor accesul la camera ta."]}},
{id:"micaccess",t:{en:["Block app microphone access","Deny apps access to your microphone."],fr:["Bloquer l'acces des applis au micro","Refuser aux applications l'acces a votre microphone."],de:["App-Mikrofonzugriff blockieren","Apps den Zugriff auf Ihr Mikrofon verweigern."],it:["Blocca accesso microfono alle app","Nega alle app l'accesso al microfono."],pl:["Blokuj dostep aplikacji do mikrofonu","Odmow aplikacjom dostepu do mikrofonu."],uk:["Заблокувати доступ додатків до мікрофона","Заборонити додаткам доступ до вашого мікрофона."],es:["Bloquear acceso de apps al microfono","Denegar a las apps el acceso a tu microfono."],pt:["Bloquear acesso das apps ao microfone","Negar as apps o acesso ao seu microfone."],ro:["Blocheaza accesul aplicatiilor la microfon","Refuza aplicatiilor accesul la microfonul tau."]}},
{id:"accountaccess",t:{en:["Block app account-info access","Deny apps access to your name, picture and account info."],fr:["Bloquer l'acces aux infos de compte","Refuser aux applications l'acces a votre nom, image et infos de compte."],de:["App-Zugriff auf Kontoinfos blockieren","Apps den Zugriff auf Namen, Bild und Kontoinformationen verweigern."],it:["Blocca accesso info account alle app","Nega alle app l'accesso a nome, immagine e info dell'account."],pl:["Blokuj dostep aplikacji do informacji o koncie","Odmow aplikacjom dostepu do imienia, obrazu i informacji o koncie."],uk:["Заблокувати доступ додатків до даних облікового запису","Заборонити додаткам доступ до вашого імені, зображення та даних облікового запису."],es:["Bloquear acceso de apps a info de cuenta","Denegar a las apps el acceso a tu nombre, imagen e informacion de cuenta."],pt:["Bloquear acesso das apps a info da conta","Negar as apps o acesso ao seu nome, imagem e informacoes da conta."],ro:["Blocheaza accesul aplicatiilor la datele contului","Refuza aplicatiilor accesul la numele, imaginea si datele contului tau."]}},
{id:"diagaccess",t:{en:["Block app diagnostics access","Stop apps reading info about your other apps."],fr:["Bloquer l'acces aux diagnostics des applis","Empecher les applications de lire les informations sur vos autres applications."],de:["App-Diagnosezugriff blockieren","Verhindern, dass Apps Informationen uber Ihre anderen Apps lesen."],it:["Blocca accesso diagnostica alle app","Impedisci alle app di leggere informazioni sulle tue altre app."],pl:["Blokuj dostep aplikacji do diagnostyki","Zablokuj odczytywanie przez aplikacje informacji o innych aplikacjach."],uk:["Заблокувати доступ додатків до діагностики","Припинити читання додатками інформації про ваші інші додатки."],es:["Bloquear acceso de apps a diagnosticos","Impedir que las apps lean informacion sobre tus otras apps."],pt:["Bloquear acesso das apps a diagnosticos","Impedir que as apps leiam informacoes sobre as suas outras apps."],ro:["Blocheaza accesul aplicatiilor la diagnostice","Impiedica aplicatiile sa citeasca informatii despre celelalte aplicatii ale tale."]}},
{id:"wifisense",t:{en:["Disable Wi-Fi Sense","Stop sharing Wi-Fi access and reporting hotspots to Microsoft."],fr:["Desactiver l'optimisation Wi-Fi","Arreter de partager l'acces Wi-Fi et de signaler les points d'acces a Microsoft."],de:["WLAN-Optimierung deaktivieren","Freigabe des WLAN-Zugriffs und Melden von Hotspots an Microsoft beenden."],it:["Disabilita Wi-Fi Sense","Smetti di condividere l'accesso Wi-Fi e di segnalare gli hotspot a Microsoft."],pl:["Wylacz funkcje Wi-Fi Sense","Zatrzymaj udostepnianie dostepu Wi-Fi i zglaszanie hotspotow do Microsoft."],uk:["Вимкнути Wi-Fi Sense","Припинити надання доступу до Wi-Fi та звітування про точки доступу до Microsoft."],es:["Desactivar Sensor de Wi-Fi","Dejar de compartir el acceso Wi-Fi y de informar de puntos de acceso a Microsoft."],pt:["Desativar o Wi-Fi Sense","Parar de partilhar o acesso Wi-Fi e de comunicar hotspots a Microsoft."],ro:["Dezactiveaza Wi-Fi Sense","Opreste partajarea accesului Wi-Fi si raportarea hotspoturilor catre Microsoft."]}},
{id:"workplacejoin",t:{en:["Block work/school prompts","Stop Windows nagging you to join a workplace account."],fr:["Bloquer les invites pro/scolaires","Empecher Windows de vous inciter a joindre un compte professionnel."],de:["Arbeits-/Schulaufforderungen blockieren","Verhindern, dass Windows Sie zum Beitritt eines Arbeitskontos drangt."],it:["Blocca richieste account aziendale","Impedisci a Windows di insistere per aggiungere un account aziendale."],pl:["Blokuj monity sluzbowe/szkolne","Zablokuj namawianie do dolaczenia konta sluzbowego przez Windows."],uk:["Блокувати запити на робочий/навчальний акаунт","Припинити нагадування Windows про приєднання до робочого облікового запису."],es:["Bloquear avisos de trabajo/escuela","Impedir que Windows insista en unir una cuenta profesional."],pt:["Bloquear pedidos profissionais/escolares","Impedir que o Windows insista para juntar uma conta profissional."],ro:["Blocheaza solicitarile de serviciu/scoala","Impiedica Windows sa te indemne sa adaugi un cont de serviciu."]}},
{id:"langtracking",t:{en:["Block language-list tracking","Stop websites reading your language list to profile you."],fr:["Bloquer le suivi de la liste de langues","Empecher les sites web de lire votre liste de langues pour vous profiler."],de:["Sprachlisten-Tracking blockieren","Verhindern, dass Websites Ihre Sprachliste zum Profiling lesen."],it:["Blocca tracciamento elenco lingue","Impedisci ai siti web di leggere il tuo elenco lingue per profilarti."],pl:["Blokuj sledzenie listy jezykow","Zablokuj odczytywanie listy jezykow przez witryny w celu profilowania."],uk:["Блокувати відстеження списку мов","Заборонити вебсайтам читати ваш список мов для профілювання."],es:["Bloquear seguimiento de lista de idiomas","Impedir que los sitios web lean tu lista de idiomas para perfilarte."],pt:["Bloquear rastreio da lista de idiomas","Impedir que os sites leiam a sua lista de idiomas para o perfilar."],ro:["Blocheaza urmarirea listei de limbi","Impiedica site-urile sa-ti citeasca lista de limbi pentru a te profila."]}},
{id:"settingssuggested",t:{en:["Disable Settings suggestions","Hide suggested content in the Settings app."],fr:["Desactiver les suggestions des Parametres","Masquer le contenu suggere dans l'application Parametres."],de:["Einstellungsvorschlage deaktivieren","Vorgeschlagene Inhalte in der App Einstellungen ausblenden."],it:["Disabilita suggerimenti Impostazioni","Nascondi i contenuti suggeriti nell'app Impostazioni."],pl:["Wylacz sugestie w Ustawieniach","Ukryj sugerowana tresc w aplikacji Ustawienia."],uk:["Вимкнути пропозиції в параметрах","Приховати запропонований вміст у застосунку «Параметри»."],es:["Desactivar sugerencias de Configuracion","Ocultar el contenido sugerido en la app Configuracion."],pt:["Desativar sugestoes das Definicoes","Ocultar o conteudo sugerido na app Definicoes."],ro:["Dezactiveaza sugestiile din Setari","Ascunde continutul sugerat in aplicatia Setari."]}},
{id:"scoobe",t:{en:["Disable setup suggestions","Hide the get-the-most-out-of-Windows prompts."],fr:["Desactiver les suggestions de configuration","Masquer les invites pour tirer le meilleur parti de Windows."],de:["Einrichtungsvorschlage deaktivieren","Die Aufforderungen zum optimalen Nutzen von Windows ausblenden."],it:["Disabilita suggerimenti di configurazione","Nascondi le richieste per sfruttare al meglio Windows."],pl:["Wylacz sugestie konfiguracji","Ukryj monity zachecajace do pelnego wykorzystania Windows."],uk:["Вимкнути пропозиції налаштування","Приховати підказки «Отримайте максимум від Windows»."],es:["Desactivar sugerencias de configuracion","Ocultar las indicaciones para sacar el maximo partido a Windows."],pt:["Desativar sugestoes de configuracao","Ocultar os avisos para tirar o maximo partido do Windows."],ro:["Dezactiveaza sugestiile de configurare","Ascunde indemnurile de a profita la maximum de Windows."]}},
{id:"wintips",t:{en:["Disable Windows tips","Stop Windows tips, tricks and suggestions."],fr:["Desactiver les conseils Windows","Arreter les conseils, astuces et suggestions Windows."],de:["Windows-Tipps deaktivieren","Windows-Tipps, -Tricks und -Vorschlage beenden."],it:["Disabilita suggerimenti di Windows","Interrompi suggerimenti, trucchi e proposte di Windows."],pl:["Wylacz porady Windows","Zatrzymaj porady, wskazowki i sugestie Windows."],uk:["Вимкнути поради Windows","Припинити поради, підказки та пропозиції Windows."],es:["Desactivar sugerencias de Windows","Detener los consejos, trucos y sugerencias de Windows."],pt:["Desativar dicas do Windows","Parar as dicas, truques e sugestoes do Windows."],ro:["Dezactiveaza sfaturile Windows","Opreste sfaturile, trucurile si sugestiile Windows."]}},
{id:"panesuggestions",t:{en:["Hide suggested content","Hide suggested content in Start and the notification center."],fr:["Masquer le contenu suggere","Masquer le contenu suggere dans le menu Demarrer et le centre de notifications."],de:["Vorgeschlagene Inhalte ausblenden","Vorgeschlagene Inhalte im Startmenu und im Infocenter ausblenden."],it:["Nascondi contenuti suggeriti","Nascondi i contenuti suggeriti nel menu Start e nel centro notifiche."],pl:["Ukryj sugerowana tresc","Ukryj sugerowana tresc w menu Start i centrum powiadomien."],uk:["Приховати запропонований вміст","Приховати запропонований вміст у меню «Пуск» і центрі сповіщень."],es:["Ocultar contenido sugerido","Ocultar el contenido sugerido en Inicio y el centro de notificaciones."],pt:["Ocultar conteudo sugerido","Ocultar o conteudo sugerido no menu Iniciar e na central de notificacoes."],ro:["Ascunde continutul sugerat","Ascunde continutul sugerat in meniul Start si centrul de notificari."]}},
{id:"startappads",t:{en:["Disable Start app ads","Hide suggested and promoted apps in the Start menu."],fr:["Desactiver les pubs d'applis du menu Demarrer","Masquer les applications suggerees et promues dans le menu Demarrer."],de:["App-Werbung im Startmenu deaktivieren","Vorgeschlagene und beworbene Apps im Startmenu ausblenden."],it:["Disabilita annunci app nel menu Start","Nascondi le app suggerite e promosse nel menu Start."],pl:["Wylacz reklamy aplikacji w menu Start","Ukryj sugerowane i promowane aplikacje w menu Start."],uk:["Вимкнути рекламу додатків у «Пуск»","Приховати запропоновані та рекламовані додатки в меню «Пуск»."],es:["Desactivar anuncios de apps en Inicio","Ocultar las apps sugeridas y promocionadas en el menu Inicio."],pt:["Desativar anuncios de apps no Iniciar","Ocultar as apps sugeridas e promovidas no menu Iniciar."],ro:["Dezactiveaza reclamele la aplicatii in Start","Ascunde aplicatiile sugerate si promovate in meniul Start."]}},
{id:"taskbaranim",t:{en:["Disable taskbar animations","Turn off taskbar button slide and fade animations."],fr:["Desactiver les animations de la barre des taches","Desactiver les animations de glissement et de fondu des boutons de la barre des taches."],de:["Taskleisten-Animationen deaktivieren","Schiebe- und Uberblendanimationen der Taskleistenschaltflachen ausschalten."],it:["Disabilita animazioni barra applicazioni","Disattiva le animazioni di scorrimento e dissolvenza dei pulsanti della barra delle applicazioni."],pl:["Wylacz animacje paska zadan","Wylacz animacje wsuwania i zanikania przyciskow paska zadan."],uk:["Вимкнути анімації панелі завдань","Вимкнути анімації ковзання та згасання кнопок панелі завдань."],es:["Desactivar animaciones de la barra de tareas","Desactivar las animaciones de deslizamiento y desvanecimiento de los botones de la barra de tareas."],pt:["Desativar animacoes da barra de tarefas","Desligar as animacoes de deslize e desvanecimento dos botoes da barra de tarefas."],ro:["Dezactiveaza animatiile barei de activitati","Dezactiveaza animatiile de glisare si estompare ale butoanelor barei de activitati."]}},
{id:"alphaselect",t:{en:["Disable selection fade","Turn off the translucent selection box in Explorer."],fr:["Desactiver le fondu de selection","Desactiver le rectangle de selection translucide dans l'Explorateur."],de:["Auswahlrechteck-Effekt deaktivieren","Das durchscheinende Auswahlrechteck im Explorer ausschalten."],it:["Disabilita dissolvenza selezione","Disattiva il rettangolo di selezione traslucido in Esplora file."],pl:["Wylacz przezroczystosc zaznaczenia","Wylacz polprzezroczysty prostokat zaznaczenia w Eksploratorze."],uk:["Вимкнути згасання виділення","Вимкнути напівпрозору рамку виділення у Провіднику."],es:["Desactivar atenuacion de seleccion","Desactivar el rectangulo de seleccion translucido en el Explorador."],pt:["Desativar desvanecimento da selecao","Desligar o retangulo de selecao translucido no Explorador."],ro:["Dezactiveaza estomparea selectiei","Dezactiveaza dreptunghiul de selectie translucid din Explorer."]}},
{id:"iconshadow",t:{en:["Disable desktop icon shadows","Remove the drop shadow behind desktop icon text."],fr:["Desactiver les ombres des icones du bureau","Supprimer l'ombre portee derriere le texte des icones du bureau."],de:["Schatten der Desktopsymbole deaktivieren","Den Schlagschatten hinter dem Desktopsymboltext entfernen."],it:["Disabilita ombre icone del desktop","Rimuovi l'ombra esterna dietro il testo delle icone del desktop."],pl:["Wylacz cienie ikon pulpitu","Usun cien rzucany za tekstem ikon pulpitu."],uk:["Вимкнути тіні значків робочого стола","Прибрати тінь за текстом значків на робочому столі."],es:["Desactivar sombras de iconos del escritorio","Quitar la sombra paralela detras del texto de los iconos del escritorio."],pt:["Desativar sombras dos icones do ambiente de trabalho","Remover a sombra atras do texto dos icones do ambiente de trabalho."],ro:["Dezactiveaza umbrele pictogramelor de pe desktop","Elimina umbra din spatele textului pictogramelor de pe desktop."]}},
{id:"powerthrottle",t:{en:["Disable power throttling","Stop throttling background apps to save power."],fr:["Desactiver la limitation d'alimentation","Arreter de limiter les applications en arriere-plan pour economiser l'energie."],de:["Energiedrosselung deaktivieren","Drosselung von Hintergrund-Apps zum Energiesparen beenden."],it:["Disabilita limitazione energetica","Smetti di limitare le app in background per risparmiare energia."],pl:["Wylacz ograniczanie zasilania","Zatrzymaj ograniczanie aplikacji w tle w celu oszczedzania energii."],uk:["Вимкнути обмеження живлення","Припинити обмеження фонових додатків для економії енергії."],es:["Desactivar limitacion de energia","Dejar de limitar las apps en segundo plano para ahorrar energia."],pt:["Desativar limitacao de energia","Parar de limitar as apps em segundo plano para poupar energia."],ro:["Dezactiveaza limitarea consumului","Opreste limitarea aplicatiilor din fundal pentru a economisi energie."]}},
{id:"restorefreq",t:{en:["Allow frequent restore points","Remove the 24-hour limit between restore points."],fr:["Autoriser des points de restauration frequents","Supprimer la limite de 24 heures entre les points de restauration."],de:["Haufige Wiederherstellungspunkte zulassen","Die 24-Stunden-Grenze zwischen Wiederherstellungspunkten entfernen."],it:["Consenti punti di ripristino frequenti","Rimuovi il limite di 24 ore tra i punti di ripristino."],pl:["Zezwol na czeste punkty przywracania","Usun limit 24 godzin miedzy punktami przywracania."],uk:["Дозволити часті точки відновлення","Прибрати обмеження у 24 години між точками відновлення."],es:["Permitir puntos de restauracion frecuentes","Quitar el limite de 24 horas entre puntos de restauracion."],pt:["Permitir pontos de restauro frequentes","Remover o limite de 24 horas entre pontos de restauro."],ro:["Permite puncte de restaurare frecvente","Elimina limita de 24 de ore dintre punctele de restaurare."]}},
{id:"bsodemoticon",t:{en:["Hide blue-screen sad face","Remove the frowning face from the crash screen."],fr:["Masquer le visage triste de l'ecran bleu","Supprimer le visage renfrogne de l'ecran de plantage."],de:["Trauriges Gesicht im Bluescreen ausblenden","Das missmutige Gesicht aus dem Absturzbildschirm entfernen."],it:["Nascondi la faccina triste della schermata blu","Rimuovi la faccina imbronciata dalla schermata di arresto anomalo."],pl:["Ukryj smutna buzie niebieskiego ekranu","Usun zasmucona buzie z ekranu awarii."],uk:["Приховати сумне обличчя на синьому екрані","Прибрати засмучене обличчя з екрана збою."],es:["Ocultar la cara triste de la pantalla azul","Quitar la cara de descontento de la pantalla de error."],pt:["Ocultar a cara triste do ecra azul","Remover a cara amuada do ecra de falha."],ro:["Ascunde fata trista de pe ecranul albastru","Elimina fata incruntata de pe ecranul de eroare."]}},
{id:"cpuprio",t:{en:["Raise game CPU priority","Give games higher CPU scheduling priority."],fr:["Augmenter la priorite CPU des jeux","Accorder aux jeux une priorite de planification CPU plus elevee."],de:["CPU-Prioritat fur Spiele erhohen","Spielen eine hohere CPU-Planungsprioritat geben."],it:["Aumenta priorita CPU dei giochi","Assegna ai giochi una priorita di pianificazione CPU piu alta."],pl:["Zwieksz priorytet CPU dla gier","Nadaj grom wyzszy priorytet planowania CPU."],uk:["Підвищити пріоритет ЦП для ігор","Надати іграм вищий пріоритет планування ЦП."],es:["Aumentar prioridad de CPU de juegos","Dar a los juegos mayor prioridad de programacion de CPU."],pt:["Aumentar prioridade de CPU dos jogos","Dar aos jogos maior prioridade de agendamento de CPU."],ro:["Creste prioritatea CPU pentru jocuri","Acorda jocurilor o prioritate mai mare de planificare CPU."]}},
{id:"gpuprio",t:{en:["Raise game GPU priority","Give games higher GPU scheduling priority."],fr:["Augmenter la priorite GPU des jeux","Accorde aux jeux une priorite d'ordonnancement GPU plus elevee."],de:["GPU-Prioritaet fuer Spiele erhoehen","Weist Spielen eine hoehere GPU-Planungsprioritaet zu."],it:["Aumenta priorita GPU dei giochi","Assegna ai giochi una priorita di pianificazione GPU piu alta."],pl:["Zwieksz priorytet GPU gier","Nadaje grom wyzszy priorytet harmonogramu GPU."],uk:["Підвищити пріоритет ГП для ігор","Надати іграм вищий пріоритет планування ГП."],es:["Aumentar prioridad de GPU en juegos","Otorga a los juegos mayor prioridad de programacion de GPU."],pt:["Aumentar prioridade de GPU dos jogos","Atribui aos jogos maior prioridade de agendamento de GPU."],ro:["Creste prioritatea GPU pentru jocuri","Acorda jocurilor o prioritate mai mare de planificare GPU."]}},
{id:"autohdr",t:{en:["Enable Auto HDR","Auto-upgrade SDR games to HDR on supported displays."],fr:["Activer Auto HDR","Convertit automatiquement les jeux SDR en HDR sur les ecrans compatibles."],de:["Auto HDR aktivieren","Wertet SDR-Spiele auf unterstuetzten Bildschirmen automatisch zu HDR auf."],it:["Attiva Auto HDR","Aggiorna automaticamente i giochi SDR a HDR sugli schermi compatibili."],pl:["Wlacz Auto HDR","Automatycznie podnosi gry SDR do HDR na obslugiwanych wyswietlaczach."],uk:["Увімкнути Auto HDR","Автоматично покращувати SDR-ігри до HDR на підтримуваних дисплеях."],es:["Habilitar Auto HDR","Mejora automaticamente los juegos SDR a HDR en pantallas compatibles."],pt:["Ativar Auto HDR","Atualiza automaticamente jogos SDR para HDR em monitores compativeis."],ro:["Activeaza Auto HDR","Imbunatateste automat jocurile SDR la HDR pe ecrane compatibile."]}},
{id:"vrr",t:{en:["Variable refresh rate","Let games use variable refresh rate on supported displays."],fr:["Frequence d'actualisation variable","Permet aux jeux d'utiliser la frequence d'actualisation variable sur les ecrans compatibles."],de:["Variable Bildwiederholfrequenz","Ermoeglicht Spielen die variable Bildwiederholfrequenz auf unterstuetzten Bildschirmen."],it:["Frequenza di aggiornamento variabile","Consente ai giochi di usare la frequenza di aggiornamento variabile sugli schermi compatibili."],pl:["Zmienna czestotliwosc odswiezania","Pozwala grom uzywac zmiennej czestotliwosci odswiezania na obslugiwanych wyswietlaczach."],uk:["Змінна частота оновлення","Дозволити іграм використовувати змінну частоту оновлення на підтримуваних дисплеях."],es:["Frecuencia de actualizacion variable","Permite a los juegos usar la frecuencia de actualizacion variable en pantallas compatibles."],pt:["Taxa de atualizacao variavel","Permite que os jogos usem a taxa de atualizacao variavel em monitores compativeis."],ro:["Rata de improspatare variabila","Permite jocurilor sa foloseasca rata de improspatare variabila pe ecrane compatibile."]}},
{id:"showhibernate",t:{en:["Show Hibernate in menu","Add Hibernate to the Start power menu."],fr:["Afficher Mettre en veille prolongee","Ajoute Mettre en veille prolongee au menu d'alimentation du menu Demarrer."],de:["Ruhezustand im Menue anzeigen","Fuegt den Ruhezustand zum Ein/Aus-Menue des Startmenues hinzu."],it:["Mostra Ibernazione nel menu","Aggiunge Ibernazione al menu di alimentazione del menu Start."],pl:["Pokaz Hibernacje w menu","Dodaje Hibernacje do menu zasilania menu Start."],uk:["Показати «Сплячий режим» у меню","Додати «Сплячий режим» до меню живлення «Пуск»."],es:["Mostrar Hibernar en el menu","Agrega Hibernar al menu de inicio/apagado del menu Inicio."],pt:["Mostrar Hibernar no menu","Adiciona Hibernar ao menu de energia do menu Iniciar."],ro:["Afiseaza Hibernare in meniu","Adauga Hibernare in meniul de alimentare din meniul Start."]}},
{id:"faststartup",t:{en:["Enable Fast Startup","Hybrid shutdown for faster boot (can affect dual-boot)."],fr:["Activer le demarrage rapide","Arret hybride pour un demarrage plus rapide (peut affecter le double amorcage)."],de:["Schnellstart aktivieren","Hybrides Herunterfahren fuer schnelleres Booten (kann Dual-Boot beeintraechtigen)."],it:["Attiva avvio rapido","Arresto ibrido per un avvio piu veloce (puo influire sul dual-boot)."],pl:["Wlacz szybkie uruchamianie","Hybrydowe zamykanie dla szybszego rozruchu (moze wplywac na dual-boot)."],uk:["Увімкнути швидкий запуск","Гібридне завершення роботи для швидшого завантаження (може впливати на подвійне завантаження)."],es:["Habilitar inicio rapido","Apagado hibrido para un arranque mas rapido (puede afectar el arranque dual)."],pt:["Ativar inicializacao rapida","Desligamento hibrido para arranque mais rapido (pode afetar o arranque duplo)."],ro:["Activeaza pornirea rapida","Inchidere hibrida pentru pornire mai rapida (poate afecta dual-boot-ul)."]}},
{id:"startupsound",t:{en:["Disable startup sound","Silence the Windows startup chime."],fr:["Desactiver le son de demarrage","Coupe le carillon de demarrage de Windows."],de:["Startsound deaktivieren","Schaltet den Windows-Startsound stumm."],it:["Disattiva suono di avvio","Disattiva il suono di avvio di Windows."],pl:["Wylacz dzwiek uruchamiania","Wycisza dzwiek startowy systemu Windows."],uk:["Вимкнути звук запуску","Вимкнути звуковий сигнал запуску Windows."],es:["Desactivar sonido de inicio","Silencia el sonido de inicio de Windows."],pt:["Desativar som de inicializacao","Silencia o som de inicializacao do Windows."],ro:["Dezactiveaza sunetul de pornire","Dezactiveaza sunetul de pornire Windows."]}},
{id:"voiceact",t:{en:["Disable voice activation","Stop apps listening for voice keywords."],fr:["Desactiver l'activation vocale","Empeche les applications d'ecouter les mots cles vocaux."],de:["Sprachaktivierung deaktivieren","Verhindert, dass Apps auf Sprachschluesselwoerter lauschen."],it:["Disattiva attivazione vocale","Impedisce alle app di ascoltare le parole chiave vocali."],pl:["Wylacz aktywacje glosowa","Uniemozliwia aplikacjom nasluchiwanie slow kluczowych glosowych."],uk:["Вимкнути голосову активацію","Припинити прослуховування додатками голосових ключових слів."],es:["Desactivar la activacion por voz","Impide que las aplicaciones escuchen palabras clave de voz."],pt:["Desativar ativacao por voz","Impede que as aplicacoes escutem palavras-chave de voz."],ro:["Dezactiveaza activarea vocala","Impiedica aplicatiile sa asculte cuvinte-cheie vocale."]}},
{id:"nodriverwu",t:{en:["No drivers via Windows Update","Stop Windows Update installing hardware drivers."],fr:["Pas de pilotes via Windows Update","Empeche Windows Update d'installer des pilotes materiels."],de:["Keine Treiber ueber Windows Update","Verhindert, dass Windows Update Hardwaretreiber installiert."],it:["Nessun driver tramite Windows Update","Impedisce a Windows Update di installare driver hardware."],pl:["Brak sterownikow przez Windows Update","Uniemozliwia usludze Windows Update instalowanie sterownikow sprzetu."],uk:["Без драйверів через Windows Update","Припинити встановлення драйверів обладнання через Windows Update."],es:["Sin controladores via Windows Update","Impide que Windows Update instale controladores de hardware."],pt:["Sem controladores via Windows Update","Impede o Windows Update de instalar controladores de hardware."],ro:["Fara drivere prin Windows Update","Impiedica Windows Update sa instaleze drivere hardware."]}},

let tweaksData=null, regData=null, tweakExplorerDirty=false, appxData=null, autoLogBuf="";
function tweakOn(id){ if(!tweaksData)return false; const x=tweaksData.find(t=>t.id===id); return x?x.on:false; }
function tweakExplorer(id){ if(!tweaksData)return false; const x=tweaksData.find(t=>t.id===id); return x?x.explorer:false; }
function setTweak(id,on){ send({cmd:'settweak',id:id,on:on}); if(tweakExplorer(id))tweakExplorerDirty=true; }

const TWORDER=[["privacy","twg_privacy"],["perf","twg_perf"],["explorer","twg_explorer"],["taskstart","twg_taskstart"],["appearance","twg_appearance"],["updates","twg_updates"],["system","twg_system"],["other","twg_other"]];
function viewTweaks(){
  let h='<p class="sub" style="padding:0 0 8px">'+esc(t("tw_intro"))+'</p>';
  if(!tweaksData){ send({cmd:'tweaks'}); return h+spinner(t("st_working")); }
  if(tweakExplorerDirty) h+='<div class="rec"><b>'+esc(t("tw_needexpl"))+'</b> <button onclick="send({cmd:\'restartexplorer\'});tweakExplorerDirty=false;setStatus(t(\'tw_restarted\'))">'+esc(t("tw_restart"))+'</button></div>';
  function twRow(tw){ const on=tweakOn(tw.id); const tr=tw.t[window.LANG]||tw.t.en;
    return '<div class="twrow"><label class="tgl"><input type="checkbox" '+(on?'checked':'')+' onchange="setTweak(\''+tw.id+'\',this.checked)"><span class="tgls"></span></label>'+
       '<div class="twtxt"><b>'+esc(tr[0])+'</b><br><span class="sub">'+esc(tr[1])+'</span></div></div>'; }
  for(const [gk,gl] of TWORDER){
    const list=TWEAKS.filter(tw=>(TWG[tw.id]||"other")===gk);
    if(!list.length) continue;
    h+='<details class="twgrp" open><summary>'+esc(t(gl))+' <span class="sub">('+list.length+')</span></summary>';
    for(const tw of list) h+=twRow(tw);
    h+='</details>';
  }
  return h;
}
function regRawSection(){
  let h='<details class="twgrp"><summary>'+esc(t("reg_raw"))+'</summary>';
  h+='<p class="sub" style="padding:0 14px">'+esc(t("reg_raw_intro"))+'</p>';
  if(!regTweaksData){ send({cmd:'regtweaks'}); return h+'<div style="padding:0 14px 10px">'+spinner(t("st_working"))+'</div></details>'; }
  h+='<div style="padding:0 14px 12px;overflow-x:auto"><table><tr><th>'+esc(t("c_name"))+'</th><th>'+esc(t("c_location"))+'</th><th></th></tr>';
  for(const r of regTweaksData){ const tw=TWEAKS.find(x=>x.id===r.id); const nm=tw?((tw.t[window.LANG]||tw.t.en)[0]):r.id;
    const loc=r.hive+'\\'+r.path+' \\ '+r.name+' = '+r.setval;
    const btn=r.on
      ? '<button onclick="regRawSet(\''+r.id+'\',false)">'+esc(t("reg_undo"))+'</button>'
      : '<button class="primary" onclick="regRawSet(\''+r.id+'\',true)">'+esc(t("reg_apply"))+'</button>';
    h+='<tr><td>'+esc(nm)+(r.on?' <span class="pill ok">'+esc(t("sec_on"))+'</span>':'')+'</td><td style="color:var(--muted);font-size:12px">'+esc(loc)+'</td><td>'+btn+'</td></tr>'; }
  return h+'</table></div></details>';
}
function regRawSet(id,on){ setTweak(id,on); regTweaksData=null; send({cmd:'regtweaks'}); setStatus(on?t("reg_apply"):t("reg_undo")); }
function viewRegistry(){
  let h='<div class="toolbar"><button class="primary" onclick="regData=null;startOp(\'registry\',t(\'reg_scanning\'));send({cmd:\'regscan\'});render()">'+esc(t("reg_scan"))+'</button>'+
    '<button onclick="startOp(\'registry\',t(\'reg_backing\'));send({cmd:\'regbackup\'})">'+esc(t("reg_backup"))+'</button>'+
    '<button onclick="send({cmd:\'regrestore\'})">'+esc(t("reg_restore"))+'</button>'+
    '<span class="sub">'+esc(t("reg_intro"))+'</span></div>';
  h+='<p class="sub" style="margin:-4px 0 8px">'+esc(t("reg_backup_note"))+'</p>';
  if(!regData){ h+=catBusy("registry")?spinner(t("reg_scanning")):'<div class="empty">'+esc(t("reg_empty"))+'</div>'; }
  else if(!regData.length){ h+='<div class="rec"><b>'+esc(t("reg_clean"))+'</b></div>'; }
  else {
    h+='<div class="opt"><button class="primary" onclick="regFix()">'+esc(t("reg_fix"))+'</button> <span class="sub">'+esc(t("reg_fix_note"))+'</span></div>';
    h+='<table><tr><th></th><th>'+esc(t("reg_cat"))+'</th><th>'+esc(t("c_name"))+'</th><th>'+esc(t("reg_missing"))+'</th><th>'+esc(t("c_location"))+'</th></tr>';
    for(const it of regData) h+='<tr><td><input type="checkbox" class="regchk" value="'+it.id+'" checked></td><td>'+esc(t("reg_cat_"+it.cat))+'</td><td>'+esc(it.name)+'</td><td style="color:var(--muted);font-size:12px">'+esc(it.target)+'</td><td>'+esc(it.where)+'</td></tr>';
    h+='</table>';
  }
  return h;
}
function regFix(){ const ids=[].slice.call(document.querySelectorAll('.regchk:checked')).map(c=>c.value); if(!ids.length){setStatus(t("reg_nosel"));return;} startOp('registry',t('reg_fixing')); send({cmd:'regfix',ids:ids.join(',')}); }
