{id:"wsl",group:"feature",danger:false,t:{en:["Linux subsystem (WSL)","Enable WSL + Virtual Machine Platform."],fr:["Sous-système Linux (WSL)","Activer WSL + plateforme de machine virtuelle."],de:["Linux-Subsystem (WSL)","WSL + Virtual Machine Platform aktivieren."],it:["Sottosistema Linux (WSL)","Abilita WSL + Virtual Machine Platform."],pl:["Podsystem Linux (WSL)","Włącz WSL + Platformę maszyny wirtualnej."],uk:["Підсистема Linux (WSL)","Увімкнути WSL + Virtual Machine Platform."],es:["Subsistema Linux (WSL)","Activar WSL + Plataforma de máquina virtual."],pt:["Subsistema Linux (WSL)","Ativar o WSL + Plataforma de Máquina Virtual."],ro:["Subsistem Linux (WSL)","Activează WSL + Virtual Machine Platform."]}},
{id:"sandbox",group:"feature",danger:false,t:{en:["Windows Sandbox","Enable the throwaway sandboxed desktop."],fr:["Bac à sable Windows","Activer le bureau isolé jetable."],de:["Windows Sandbox","Den verwerfbaren isolierten Desktop aktivieren."],it:["Windows Sandbox","Abilita il desktop isolato usa e getta."],pl:["Piaskownica Windows","Włącz jednorazowy izolowany pulpit."],uk:["Windows Sandbox","Увімкнути одноразовий ізольований робочий стіл."],es:["Espacio aislado de Windows","Activar el escritorio aislado desechable."],pt:["Sandbox do Windows","Ativar o ambiente isolado descartável."],ro:["Windows Sandbox","Activează desktopul izolat de unică folosință."]}},
{id:"nfs",group:"feature",danger:false,t:{en:["NFS client","Enable mounting Unix/NAS network shares."],fr:["Client NFS","Activer le montage de partages réseau Unix/NAS."],de:["NFS-Client","Einbinden von Unix/NAS-Netzwerkfreigaben aktivieren."],it:["Client NFS","Abilita il montaggio di condivisioni Unix/NAS."],pl:["Klient NFS","Włącz montowanie udziałów sieciowych Unix/NAS."],uk:["Клієнт NFS","Увімкнути монтування мережевих ресурсів Unix/NAS."],es:["Cliente NFS","Activar el montaje de recursos de red Unix/NAS."],pt:["Cliente NFS","Ativar a montagem de partilhas de rede Unix/NAS."],ro:["Client NFS","Activează montarea partajărilor de rețea Unix/NAS."]}},
{id:"legacymedia",group:"feature",danger:false,t:{en:["Legacy media (DirectPlay)","Enable DirectPlay + legacy components for old games."],fr:["Médias hérités (DirectPlay)","Activer DirectPlay + composants hérités pour vieux jeux."],de:["Legacy-Medien (DirectPlay)","DirectPlay + Legacykomponenten für alte Spiele aktivieren."],it:["Media legacy (DirectPlay)","Abilita DirectPlay + componenti legacy per vecchi giochi."],pl:["Starsze multimedia (DirectPlay)","Włącz DirectPlay + starsze składniki dla starych gier."],uk:["Старі медіа (DirectPlay)","Увімкнути DirectPlay + застарілі компоненти для старих ігор."],es:["Medios heredados (DirectPlay)","Activar DirectPlay + componentes heredados para juegos antiguos."],pt:["Multimédia legada (DirectPlay)","Ativar DirectPlay + componentes legados para jogos antigos."],ro:["Media moștenită (DirectPlay)","Activează DirectPlay + componente vechi pentru jocuri vechi."]}}
,
{id:"memoryintegrity",danger:true,t:{en:["Disable Memory Integrity (HVCI)","Turn off core isolation; can fix driver problems and boost performance."],fr:["Desactiver l'integrite de la memoire (HVCI)","Desactive l'isolation du noyau ; peut resoudre des problemes de pilotes et ameliorer les performances."],de:["Speicherintegritat (HVCI) deaktivieren","Kernisolierung ausschalten; kann Treiberprobleme beheben und die Leistung steigern."],it:["Disattiva l'integrita della memoria (HVCI)","Disattiva l'isolamento del core; puo risolvere problemi dei driver e migliorare le prestazioni."],pl:["Wylacz integralnosc pamieci (HVCI)","Wylacza izolacje rdzenia; moze rozwiazac problemy ze sterownikami i zwiekszyc wydajnosc."],uk:["Вимкнути цілісність пам'яті (HVCI)","Вимикає ізоляцію ядра; може усунути проблеми з драйверами та підвищити продуктивність."],es:["Desactivar la integridad de memoria (HVCI)","Desactiva el aislamiento del nucleo; puede solucionar problemas de controladores y mejorar el rendimiento."],pt:["Desativar a integridade de memoria (HVCI)","Desativa o isolamento do nucleo; pode corrigir problemas de drivers e aumentar o desempenho."],ro:["Dezactiveaza integritatea memoriei (HVCI)","Dezactiveaza izolarea nucleului; poate rezolva probleme de drivere si imbunatati performanta."]}},
{id:"vbs",danger:true,t:{en:["Disable Virtualization-Based Security","Turn off VBS; can improve game and VM performance (lowers security)."],fr:["Desactiver la securite basee sur la virtualisation","Desactive VBS ; peut ameliorer les performances des jeux et des machines virtuelles (reduit la securite)."],de:["Virtualisierungsbasierte Sicherheit deaktivieren","VBS ausschalten; kann die Leistung von Spielen und VMs verbessern (verringert die Sicherheit)."],it:["Disattiva la sicurezza basata sulla virtualizzazione","Disattiva VBS; puo migliorare le prestazioni di giochi e macchine virtuali (riduce la sicurezza)."],pl:["Wylacz zabezpieczenia oparte na wirtualizacji","Wylacza VBS; moze poprawic wydajnosc gier i maszyn wirtualnych (obniza bezpieczenstwo)."],uk:["Вимкнути безпеку на основі віртуалізації","Вимикає VBS; може покращити продуктивність ігор і віртуальних машин (знижує безпеку)."],es:["Desactivar la seguridad basada en virtualizacion","Desactiva VBS; puede mejorar el rendimiento de juegos y maquinas virtuales (reduce la seguridad)."],pt:["Desativar a seguranca baseada em virtualizacao","Desativa o VBS; pode melhorar o desempenho de jogos e maquinas virtuais (reduz a seguranca)."],ro:["Dezactiveaza securitatea bazata pe virtualizare","Dezactiveaza VBS; poate imbunatati performanta jocurilor si a masinilor virtuale (reduce securitatea)."]}},
{id:"uaclower",danger:true,t:{en:["Lower UAC prompts","Stop UAC dimming the screen for admin actions (less secure)."],fr:["Reduire les invites UAC","Empeche l'UAC d'assombrir l'ecran lors des actions d'administration (moins securise)."],de:["UAC-Eingabeaufforderungen reduzieren","Verhindert das Abdunkeln des Bildschirms durch die UAC bei Administratoraktionen (weniger sicher)."],it:["Riduci le richieste UAC","Impedisce all'UAC di oscurare lo schermo per le azioni di amministratore (meno sicuro)."],pl:["Zmniejsz monity UAC","Zatrzymuje przyciemnianie ekranu przez UAC podczas akcji administratora (mniej bezpieczne)."],uk:["Зменшити запити UAC","Припиняє затемнення екрана службою UAC під час дій адміністратора (менш безпечно)."],es:["Reducir las solicitudes de UAC","Evita que el UAC atenue la pantalla para las acciones de administrador (menos seguro)."],pt:["Reduzir os avisos do UAC","Impede que o UAC escureca a tela para acoes de administrador (menos seguro)."],ro:["Reducerea solicitarilor UAC","Impiedica UAC sa intunece ecranul pentru actiunile de administrator (mai putin sigur)."]}},
{id:"blockwinupdate",danger:true,t:{en:["Block all Windows Updates","Stop Windows downloading and installing any updates (security risk)."],fr:["Bloquer toutes les mises a jour Windows","Empeche Windows de telecharger et d'installer des mises a jour (risque de securite)."],de:["Alle Windows-Updates blockieren","Verhindert, dass Windows Updates herunterladt und installiert (Sicherheitsrisiko)."],it:["Blocca tutti gli aggiornamenti di Windows","Impedisce a Windows di scaricare e installare aggiornamenti (rischio per la sicurezza)."],pl:["Zablokuj wszystkie aktualizacje systemu Windows","Zatrzymuje pobieranie i instalowanie wszelkich aktualizacji przez system Windows (zagrozenie bezpieczenstwa)."],uk:["Заблокувати всі оновлення Windows","Припиняє завантаження та встановлення будь-яких оновлень у Windows (ризик для безпеки)."],es:["Bloquear todas las actualizaciones de Windows","Impide que Windows descargue e instale cualquier actualizacion (riesgo de seguridad)."],pt:["Bloquear todas as atualizacoes do Windows","Impede que o Windows baixe e instale quaisquer atualizacoes (risco de seguranca)."],ro:["Blocheaza toate actualizarile Windows","Impiedica Windows sa descarce si sa instaleze actualizari (risc de securitate)."]}},
{id:"deferfeature",danger:false,t:{en:["Defer feature updates 1 year","Delay big Windows feature updates by up to 365 days."],fr:["Reporter les mises a jour de fonctionnalites d'un an","Retarde les grandes mises a jour de fonctionnalites de Windows jusqu'a 365 jours."],de:["Funktionsupdates um 1 Jahr verschieben","Verzogert grosse Windows-Funktionsupdates um bis zu 365 Tage."],it:["Rinvia gli aggiornamenti delle funzionalita di 1 anno","Ritarda i grandi aggiornamenti delle funzionalita di Windows fino a 365 giorni."],pl:["Odrocz aktualizacje funkcji o 1 rok","Opoznia duze aktualizacje funkcji systemu Windows o maksymalnie 365 dni."],uk:["Відкласти оновлення функцій на 1 рік","Затримує великі оновлення функцій Windows на термін до 365 днів."],es:["Aplazar las actualizaciones de caracteristicas 1 ano","Retrasa las grandes actualizaciones de caracteristicas de Windows hasta 365 dias."],pt:["Adiar atualizacoes de recursos por 1 ano","Atrasa as grandes atualizacoes de recursos do Windows em ate 365 dias."],ro:["Amana actualizarile de functii cu 1 an","Intarzie actualizarile mari de functii Windows cu pana la 365 de zile."]}},
{id:"s3sleep",danger:false,t:{en:["Use S3 sleep (not Modern Standby)","Switch to classic S3 sleep that cuts power properly on some laptops."],fr:["Utiliser la veille S3 (et non la veille moderne)","Bascule vers la veille S3 classique qui coupe correctement l'alimentation sur certains portables."],de:["S3-Energiesparmodus verwenden (nicht Modern Standby)","Wechselt zum klassischen S3-Energiesparmodus, der bei einigen Laptops die Stromzufuhr richtig abschaltet."],it:["Usa la sospensione S3 (non Modern Standby)","Passa alla sospensione S3 classica che interrompe correttamente l'alimentazione su alcuni portatili."],pl:["Uzyj uspienia S3 (zamiast Modern Standby)","Przelacza na klasyczne uspienie S3, ktore prawidlowo odcina zasilanie w niektorych laptopach."],uk:["Використовувати сон S3 (а не Modern Standby)","Перемикає на класичний режим сну S3, який належно вимикає живлення на деяких ноутбуках."],es:["Usar suspension S3 (no Modern Standby)","Cambia a la suspension S3 clasica que corta la alimentacion correctamente en algunos portatiles."],pt:["Usar suspensao S3 (nao Modern Standby)","Muda para a suspensao S3 classica que corta a energia corretamente em alguns portateis."],ro:["Utilizeaza repausul S3 (nu Modern Standby)","Comuta la repausul S3 clasic, care intrerupe corect alimentarea pe unele laptopuri."]}},
{id:"opensshserver",danger:true,t:{en:["Enable OpenSSH server","Install and start the built-in SSH server for remote access."],fr:["Activer le serveur OpenSSH","Installe et demarre le serveur SSH integre pour l'acces a distance."],de:["OpenSSH-Server aktivieren","Installiert und startet den integrierten SSH-Server fur den Fernzugriff."],it:["Abilita il server OpenSSH","Installa e avvia il server SSH integrato per l'accesso remoto."],pl:["Wlacz serwer OpenSSH","Instaluje i uruchamia wbudowany serwer SSH do zdalnego dostepu."],uk:["Увімкнути сервер OpenSSH","Встановлює та запускає вбудований SSH-сервер для віддаленого доступу."],es:["Habilitar el servidor OpenSSH","Instala e inicia el servidor SSH integrado para el acceso remoto."],pt:["Ativar o servidor OpenSSH","Instala e inicia o servidor SSH integrado para acesso remoto."],ro:["Activeaza serverul OpenSSH","Instaleaza si porneste serverul SSH integrat pentru acces la distanta."]}},
{id:"f8recovery",danger:false,t:{en:["Enable F8 boot menu","Restore the legacy F8 Advanced Boot Options menu at startup."],fr:["Activer le menu de demarrage F8","Restaure l'ancien menu Options de demarrage avancees (F8) au demarrage."],de:["F8-Startmenu aktivieren","Stellt das klassische Menu \"Erweiterte Startoptionen\" (F8) beim Start wieder her."],it:["Abilita il menu di avvio F8","Ripristina il classico menu Opzioni di avvio avanzate (F8) all'avvio."],pl:["Wlacz menu rozruchu F8","Przywraca dawne menu Zaawansowane opcje rozruchu (F8) podczas uruchamiania."],uk:["Увімкнути меню завантаження F8","Відновлює застаріле меню додаткових параметрів завантаження (F8) під час запуску."],es:["Habilitar el menu de arranque F8","Restaura el antiguo menu Opciones de arranque avanzadas (F8) al iniciar."],pt:["Ativar o menu de inicializacao F8","Restaura o antigo menu Opcoes de Inicializacao Avancadas (F8) na inicializacao."],ro:["Activeaza meniul de pornire F8","Restaureaza vechiul meniu Optiuni avansate de pornire (F8) la pornire."]}},
{id:"ntppool",danger:false,t:{en:["Use pool.ntp.org time server","Switch the Windows time server to pool.ntp.org."],fr:["Utiliser le serveur de temps pool.ntp.org","Bascule le serveur de temps de Windows vers pool.ntp.org."],de:["Zeitserver pool.ntp.org verwenden","Wechselt den Windows-Zeitserver zu pool.ntp.org."],it:["Usa il server di riferimento orario pool.ntp.org","Cambia il server di riferimento orario di Windows in pool.ntp.org."],pl:["Uzyj serwera czasu pool.ntp.org","Zmienia serwer czasu systemu Windows na pool.ntp.org."],uk:["Використовувати сервер часу pool.ntp.org","Змінює сервер часу Windows на pool.ntp.org."],es:["Usar el servidor de hora pool.ntp.org","Cambia el servidor de hora de Windows a pool.ntp.org."],pt:["Usar o servidor de hora pool.ntp.org","Muda o servidor de hora do Windows para pool.ntp.org."],ro:["Utilizeaza serverul de timp pool.ntp.org","Schimba serverul de timp Windows in pool.ntp.org."]}},
{id:"svcsysmain",danger:true,t:{en:["Disable SysMain (Superfetch)","Stop the service that preloads apps into RAM."],fr:["Desactiver SysMain (Superfetch)","Arrete le service qui precharge les applications dans la RAM."],de:["SysMain (Superfetch) deaktivieren","Stoppt den Dienst, der Apps in den RAM vorladt."],it:["Disattiva SysMain (Superfetch)","Arresta il servizio che precarica le app nella RAM."],pl:["Wylacz SysMain (Superfetch)","Zatrzymuje usluge, ktora wstepnie laduje aplikacje do pamieci RAM."],uk:["Вимкнути SysMain (Superfetch)","Зупиняє службу, яка попередньо завантажує програми в оперативну пам'ять."],es:["Desactivar SysMain (Superfetch)","Detiene el servicio que precarga las aplicaciones en la RAM."],pt:["Desativar o SysMain (Superfetch)","Para o servico que pre-carrega aplicativos na RAM."],ro:["Dezactiveaza SysMain (Superfetch)","Opreste serviciul care preincarca aplicatiile in RAM."]}},
{id:"svcspooler",danger:true,t:{en:["Disable Print Spooler","Stop the print service (closes an attack surface; printing stops)."],fr:["Desactiver le spouleur d'impression","Arrete le service d'impression (ferme une surface d'attaque ; l'impression s'arrete)."],de:["Druckwarteschlange deaktivieren","Stoppt den Druckdienst (schliesst eine Angriffsflache; das Drucken wird beendet)."],it:["Disattiva lo spooler di stampa","Arresta il servizio di stampa (chiude una superficie di attacco; la stampa si interrompe)."],pl:["Wylacz bufor wydruku","Zatrzymuje usluge drukowania (zamyka powierzchnie ataku; drukowanie zostaje wstrzymane)."],uk:["Вимкнути диспетчер друку","Зупиняє службу друку (закриває поверхню атаки; друк припиняється)."],es:["Desactivar la cola de impresion","Detiene el servicio de impresion (cierra una superficie de ataque; la impresion se detiene)."],pt:["Desativar o spooler de impressao","Para o servico de impressao (fecha uma superficie de ataque; a impressao para)."],ro:["Dezactiveaza spooler-ul de imprimare","Opreste serviciul de imprimare (inchide o suprafata de atac; imprimarea se opreste)."]}},
{id:"svcsearch",danger:true,t:{en:["Disable Search indexing","Stop the Windows Search indexing service (search becomes slower)."],fr:["Desactiver l'indexation de la recherche","Arrete le service d'indexation de la recherche Windows (la recherche devient plus lente)."],de:["Suchindizierung deaktivieren","Stoppt den Windows Search-Indizierungsdienst (die Suche wird langsamer)."],it:["Disattiva l'indicizzazione della ricerca","Arresta il servizio di indicizzazione di Windows Search (la ricerca diventa piu lenta)."],pl:["Wylacz indeksowanie wyszukiwania","Zatrzymuje usluge indeksowania Windows Search (wyszukiwanie staje sie wolniejsze)."],uk:["Вимкнути індексування пошуку","Зупиняє службу індексування Windows Search (пошук стає повільнішим)."],es:["Desactivar la indexacion de busqueda","Detiene el servicio de indexacion de Windows Search (la busqueda se vuelve mas lenta)."],pt:["Desativar a indexacao de pesquisa","Para o servico de indexacao do Windows Search (a pesquisa fica mais lenta)."],ro:["Dezactiveaza indexarea cautarii","Opreste serviciul de indexare Windows Search (cautarea devine mai lenta)."]}}
,
{id:"schedtasks",danger:false,t:{en:["Disable telemetry scheduled tasks","Turn off known data-collection scheduled tasks (Compatibility Appraiser, CEIP, feedback)."],fr:["Desactiver les taches planifiees de telemetrie","Desactive les taches planifiees connues de collecte de donnees (Evaluateur de compatibilite, CEIP, commentaires)."],de:["Geplante Telemetrieaufgaben deaktivieren","Bekannte geplante Datenerfassungsaufgaben deaktivieren (Kompatibilitatsprufung, CEIP, Feedback)."],it:["Disattiva le attivita pianificate di telemetria","Disattiva le attivita pianificate note per la raccolta dati (Valutazione compatibilita, CEIP, feedback)."],pl:["Wylacz zaplanowane zadania telemetrii","Wylacz znane zaplanowane zadania zbierania danych (Ocena zgodnosci, CEIP, opinie)."],uk:["Вимкнути заплановані завдання телеметрії","Вимкнути відомі заплановані завдання збору даних (Оцінювач сумісності, CEIP, відгуки)."],es:["Desactivar tareas programadas de telemetria","Desactiva las tareas programadas conocidas de recopilacion de datos (Evaluador de compatibilidad, CEIP, comentarios)."],pt:["Desativar tarefas agendadas de telemetria","Desativa as tarefas agendadas conhecidas de recolha de dados (Avaliador de compatibilidade, CEIP, feedback)."],ro:["Dezactiveaza activitatile programate de telemetrie","Dezactiveaza activitatile programate cunoscute de colectare a datelor (Evaluator de compatibilitate, CEIP, feedback)."]}},
{id:"wudefault",danger:false,t:{en:["Restore default Windows Update","Remove update-blocking and deferral policies set by the tools above."],fr:["Restaurer Windows Update par defaut","Supprime les strategies de blocage et de report des mises a jour definies par les outils ci-dessus."],de:["Standard-Windows Update wiederherstellen","Entfernt die von den obigen Tools festgelegten Richtlinien zum Blockieren und Aufschieben von Updates."],it:["Ripristina Windows Update predefinito","Rimuove i criteri di blocco e differimento degli aggiornamenti impostati dagli strumenti precedenti."],pl:["Przywroc domyslny Windows Update","Usun zasady blokowania i odraczania aktualizacji ustawione przez powyzsze narzedzia."],uk:["Відновити стандартний Windows Update","Видалити політики блокування та відтермінування оновлень, установлені наведеними вище засобами."],es:["Restaurar Windows Update predeterminado","Elimina las directivas de bloqueo y aplazamiento de actualizaciones establecidas por las herramientas anteriores."],pt:["Restaurar Windows Update predefinido","Remove as politicas de bloqueio e adiamento de atualizacoes definidas pelas ferramentas acima."],ro:["Restaureaza Windows Update implicit","Elimina politicile de blocare si amanare a actualizarilor setate de instrumentele de mai sus."]}},
{id:"resetprinters",danger:false,t:{en:["Reset printers","Restart the print spooler and clear the stuck print queue."],fr:["Reinitialiser les imprimantes","Redemarre le spouleur d'impression et vide la file d'attente d'impression bloquee."],de:["Drucker zurucksetzen","Startet die Druckwarteschlange neu und leert die blockierte Druckerwarteschlange."],it:["Reimposta le stampanti","Riavvia lo spooler di stampa e svuota la coda di stampa bloccata."],pl:["Resetuj drukarki","Uruchamia ponownie bufor wydruku i czysci zablokowana kolejke wydruku."],uk:["Скинути принтери","Перезапустити диспетчер черги друку та очистити застряглу чергу друку."],es:["Restablecer impresoras","Reinicia la cola de impresion y borra los trabajos de impresion atascados."],pt:["Repor impressoras","Reinicia o spooler de impressao e limpa a fila de impressao bloqueada."],ro:["Reseteaza imprimantele","Reporneste spoolerul de imprimare si goleste coada de imprimare blocata."]}},
{id:"installerclean",danger:true,t:{en:["Clean Windows Installer leftovers","Send orphaned .msi/.msp in C:\\Windows\\Installer to the Recycle Bin (can free GBs)."],fr:["Nettoyer les residus de Windows Installer","Envoyer les .msi/.msp orphelins de C:\\Windows\\Installer vers la Corbeille (peut liberer des Go)."],de:["Windows Installer-Reste bereinigen","Verwaiste .msi/.msp in C:\\Windows\\Installer in den Papierkorb verschieben (kann GB freigeben)."],it:["Pulisci i residui di Windows Installer","Sposta i file .msi/.msp orfani in C:\\Windows\\Installer nel Cestino (puo liberare GB)."],pl:["Wyczysc pozostalosci Instalatora Windows","Przenies osierocone pliki .msi/.msp z C:\\Windows\\Installer do Kosza (moze zwolnic GB)."],uk:["Очистити залишки Windows Installer","Перемістити осиротілі .msi/.msp з C:\\Windows\\Installer до Кошика (може звільнити ГБ)."],es:["Limpiar restos de Windows Installer","Mover los .msi/.msp huerfanos de C:\\Windows\\Installer a la Papelera (puede liberar GB)."],pt:["Limpar resíduos do Windows Installer","Mover os .msi/.msp orfaos de C:\\Windows\\Installer para a Reciclagem (pode libertar GB)."],ro:["Curata resturile Windows Installer","Muta fisierele .msi/.msp orfane din C:\\Windows\\Installer in Cosul de reciclare (poate elibera GB)."]}}
];

  document.querySelectorAll('#main .approw').forEach(r=>{ r.style.display=(!q||r.dataset.s.indexOf(q)>=0)?'':'none'; });
  document.querySelectorAll('#main details.appgrp').forEach(d=>{ const any=[...d.querySelectorAll('.approw')].some(r=>r.style.display!=='none'); d.style.display=any?'':'none'; if(any&&q)d.open=true; });

}

function startUpdateAll(){
  if(!wingetUpsData||!wingetUpsData.length) return;
  if(!confirm(t('upd_confirm'))) return;
  updQueue = wingetUpsData.map(u=>u.id).filter(id=>id && id!=='Microsoft.AppInstaller' && id!=='Microsoft.Edge');  // skip winget self-update (deadlock) and Edge (updates itself; winget can't)
  updTotal = updQueue.length; updActive = true;
  startOp('install', t('upd_updating'));
  ilogLine('=== '+t('upd_updating')+' ('+updTotal+') ===');
  if(cat==='install')render();
  updNext();
}
function updNext(){
  if(!updQueue.length){ updActive=false; wingetUpsData=null; endOp('install', t('st_done'));
    startOp('install',t('upd_checking')); send({cmd:'wingetups'}); if(cat==='install')render(); return; }
  const id=updQueue.shift();
  ilogLine('--- '+id+' ('+(updTotal-updQueue.length)+'/'+updTotal+') ---');
  send({cmd:'wingetupgrade', id:id});
}

    o.onclick=function(e){ if(e.target===o||e.target.id==='lbclose') closeFull(); };

}

function viewPhotos(){
  const folder=window.DUPFOLDER||(dupData&&dupData.folder)||"";
  if(window.DUPMAX==null) window.DUPMAX=500;
  let h='<div class="toolbar">'+
    '<button onclick="send({cmd:\'dupfolder\'})">'+esc(t("dup_choose"))+'</button>'+

  if(!dupData) return h+'<div class="empty">'+esc(t("dup_empty"))+'</div>';
  const groups=dupData.groups||[]; const total=(dupData.total!=null?dupData.total:groups.length);
  const cap=(total>groups.length)?' <span class="sub">('+esc(t("dup_showing"))+' '+groups.length+'/'+total+')</span>':'';
  h+='<div class="rec"><b>'+esc(t("dup_found"))+'</b> '+total+cap+' &middot; '+esc(t("dup_reclaim"))+' '+esc(fmtSize(dupData.wasteKb))+'<br><span class="sub">'+esc(dupData.folder)+'</span></div>';
  if(!groups.length) return h;
  h+='<div class="opt"><button class="primary" onclick="dupDelete()">'+esc(t("dup_delete"))+'</button> <span class="sub">'+esc(t("dup_delete_note"))+'</span>'+
     '<span style="margin-left:auto"></span><span class="sub">'+esc(t("dup_size"))+':</span> '+
     '<button onclick="setDupSize(90)">S</button><button onclick="setDupSize(150)">M</button><button onclick="setDupSize(240)">L</button></div>';
  for(let gi=0;gi<groups.length;gi++){ const g=groups[gi];
    h+='<div class="dupgrp">';
    if(g.thumb) h+='<img class="dupthumb" src="'+g.thumb+'" style="width:'+dupSize+'px;height:'+dupSize+'px;float:left;margin:0 12px 8px 0" '+
        'onclick="showFullIdx('+gi+')" title="'+esc(t("dup_clickfull"))+'">';
    h+='<div class="sub">'+esc(fmtSize(g.sizeKb))+' &times; '+g.files.length+'</div>';
    for(let fi=0;fi<g.files.length;fi++){ const f=g.files[fi];
      h+='<div class="dupfile"><input type="checkbox" class="dupchk" data-path="'+esc(f.path)+'" '+(fi>0?'checked':'')+'>'+
         '<span class="p">'+esc(f.path)+'</span></div>'; }
    h+='<div style="clear:both"></div></div>'; }
  return h;
}
function dupDelete(){
  const boxes=[...document.querySelectorAll('.dupchk:checked')];
  const paths=boxes.map(b=>b.dataset.path).filter(x=>x);
  if(!paths.length){ setStatus(t("dup_none_sel")); return; }
  if(dupData&&dupData.groups){ const del=new Set(paths);
    dupData.groups.forEach(g=>g.files=g.files.filter(f=>!del.has(f.path)));
    dupData.groups=dupData.groups.filter(g=>g.files.length>1);
    // Recompute reclaimable: per group, the extra copies beyond the first.
    dupData.wasteKb=dupData.groups.reduce((s,g)=>s+(g.sizeKb||0)*(g.files.length-1),0); }
  startOp("photos",t("dup_deleting")); send({cmd:'dupdelete',paths:paths.join('|')}); endOp("photos",t("dup_deleted")); render();
}

function svcLinks(d){
  const ports=d.ports||[]; let out=[];
  for(const p of ports){
    if(p===80) out.push(link('http://'+d.ip,'web'));
    else if(p===443) out.push(link('https://'+d.ip,'web (HTTPS)'));
    else if(p===8080) out.push(link('http://'+d.ip+':8080','web (8080)'));
    else if(p===445) out.push('SMB');
    else if(p===22) out.push('SSH');
    else if(p===23) out.push('Telnet');
  }
  return out.join(', ');
}

    '<div class="opt"><b>'+esc(t("au_h"))+'</b>'+
      '<label style="display:block;margin:6px 0"><input type="checkbox" '+(window.AUTOUPDATE?'checked':'')+' onchange="send({cmd:\'setautoupdate\',on:this.checked})"> '+esc(t("au_autostart"))+'</label>'+

function auStatus(){
  if(updateBusy) return esc(t("au_checking"));
  if(!updateData) return "";
  if(!updateData.ok) return esc(t("au_failcheck"));
  if(updateData.newer) return esc(t("au_avail").replace("{v}",updateData.latest));
  return esc(t("au_uptodate").replace("{v}",updateData.current));
}

  h+=hSec('More System checks','<ul>'+
    '<li><b>Hardening</b> - checks security settings (old file sharing, Remote Desktop, AutoPlay, Guest account, UAC) and fixes each in one click.</li>'+

    '<li><b>Privacy</b> - who can sign in (and whether any account needs no password), whether your drive is encrypted (with a reminder to back up your BitLocker recovery key), which apps may use your camera, microphone and location, and your advertising-ID / diagnostic-data setting.</li></ul>');

  h+=hSec('Drivers','<ul>'+

    '<li><b>Updates / Problem devices / All drivers / Sources</b> - sub-tabs with the details and download links.</li>'+

  h+=hSec('Apps','<p>Lists your installed programs with size, install date and best-effort last-used date, flags large/unused ones, and lets you <b>Uninstall</b> or <b>Open folder</b> per app.</p>');

  h+=hSec('Debloat (experimental)','<p>Bigger, mostly one-way changes - remove built-in Store apps <b>one by one</b>, debloat Edge, disable telemetry services, switch DNS, repair system files, reset Windows Update or the network. Some can’t be undone with a switch, so make a restore point first and read each one before running it.</p>');

  h+=hSec('Staying safe','<p>Deletions go to the <b>Recycle Bin</b> where possible, registry fixes are backed up first, and Auto Update / risky actions make a <b>System Restore point</b>. If something ever looks wrong, you can roll back from <i>System &rsaquo; Restore points</i> or Windows’ own System Restore.</p>');

  h+='</div>';
  return h;
}
function startAuto(){
  if(!scan){ setStatus(t("a_needscan")); return; }
  const ups=scan.drivers.filter(x=>x.verdict==="UPDATE AVAILABLE");
  if(!ups.length){ cat="drivers";drvSub="auto"; render(); setStatus(t("a_noupd")); return; }
  // Read the user's selection BEFORE re-rendering (render resets the checkboxes).
  const restore=$("optRestore")?$("optRestore").checked:true;
  const ids=[...document.querySelectorAll('.updchk:checked')].map(b=>b.dataset.id).filter(x=>x);
  if(!ids.length){ setStatus(t("a_noupd")); return; }
  autoLogBuf=""; cat="drivers";drvSub="auto"; render();
  send({cmd:'auto',restore:restore,ids:ids.join(',')});
}
// Render the auto-update log, turning the "...vendor tool in Sources" hint into a
// clickable link that jumps to the Drivers > Sources sub-tab.
function logHtml(){ return esc(autoLogBuf).replace(/vendor tool in (Sources)/g,
  'vendor tool in <a href="#" style="color:var(--accent);text-decoration:underline" onclick="cat=\'drivers\';drvSub=\'sources\';render();return false;">$1</a>'); }
function logLine(s){ autoLogBuf+=s+"\n"; cat="drivers";drvSub="auto"; if(!$("log")) render(); const l=$("log"); if(l){ l.innerHTML=logHtml(); l.scrollTop=l.scrollHeight; } }

function applyStaticText(){
  if(!scan && !$("status").dataset.live) setStatus(t("st_idle"));
}

function reRender(c){ if(cat===c) render(); else buildCatBar(); }
window.chrome.webview.addEventListener('message', e=>{
  const m=e.data;
  // Results store data + clear that op; they NEVER force a category switch.
  if(m.type==="scan"){ scan=m.data; reRender("drivers"); }   // inventory ready; check still running
  else if(m.type==="progress"){ catStatus.drivers=t("st_checking")+(m.total?" "+m.done+"/"+m.total:"…");
    if(cat==="drivers"){ setStatus(catStatus.drivers); showBar(true); $("barfill").style.width=(m.total?Math.round(m.done/m.total*100):0)+"%"; } }
  else if(m.type==="checkDone"){ scan=m.data; if(drvSub==="summary")drvSub="updates";
    endOp("drivers", t("st_done")+" - "+scan.drivers.filter(x=>x.verdict==="UPDATE AVAILABLE").length+" "+t("st_updavail")); reRender("drivers"); }
  else if(m.type==="apps"){ appsData=m.data; endOp("apps", t("st_done")); reRender("apps"); }
  else if(m.type==="network"){ netData=m.data; endOp("netdevices", t("st_done")); reRender("network"); }
  else if(m.type==="system"){ sysData=m.data; endOp("sysalerts", t("st_done")); reRender("system"); }
  else if(m.type==="health"){ healthData=m.data; endOp("health", t("st_done")); reRender("health"); }
  else if(m.type==="unwanted"){ unwantedData=m.data; endOp("unwanted", t("st_done")); reRender("system"); }
  else if(m.type==="hygiene"){ hygieneData=m.data; endOp("hygiene", t("st_done")); reRender("system"); }
  else if(m.type==="perf"){ perfData=m.data; endOp("perf", t("st_done")); reRender("system"); }
  else if(m.type==="battery"){ batteryData=m.data; endOp("battery", t("st_done")); reRender("system"); }
  else if(m.type==="diskhealth"){ diskData=m.data; endOp("disks", t("st_done")); reRender("system"); }
  else if(m.type==="winupdate"){ winupdateData=m.data; endOp("winupdate", t("st_done")); reRender("system"); }
  else if(m.type==="cleanup"){ cleanupData=m.data; endOp("cleanup", t("st_done")); reRender("system"); }
  else if(m.type==="cleanupdone"){ cleanupData=m.data; endOp("cleanup", t("clean_done")); reRender("system"); }
  else if(m.type==="netdiag"){ netDiagData=m.data; endOp("netdiag", t("st_done")); reRender("network"); }
  else if(m.type==="fwconn"){ fwData=m.data; endOp("netfw", t("st_done")); if(cat==="network")render(); }
  else if(m.type==="dupfolder"){ window.DUPFOLDER=m.folder; if(cat==="photos")render(); }
  else if(m.type==="dupscan"){ dupData=m.data; if(m.data&&m.data.folder)window.DUPFOLDER=m.data.folder; endOp("photos", t("st_done")); reRender("photos"); }
  else if(m.type==="dupscanning"){ startOp("photos", t("dup_scanning")); }
  else if(m.type==="dupdeletedone"){ catStatus.photos=t("dup_deleted"); if(cat==="photos")setStatus(catStatus.photos); }
  else if(m.type==="restoredone"){ catStatus.system=m.ok?t("restore_created"):t("restore_failed"); if(cat==="system")setStatus(catStatus.system); }
  else if(m.type==="driverbackup"){ endOp("drivers", m.ok?(t("drv_backup_done")+" "+m.path):t("drv_backup_fail")); }
  else if(m.type==="driverimport"){ endOp("drivers", m.ok?(t("drv_import_done")+" "+m.path):t("drv_import_fail")); }
  else if(m.type==="tweaks"){ tweaksData=m.data; if(cat==="tweaks")render(); }
  else if(m.type==="regscan"){ regData=m.data; endOp("registry",t("st_done")); reRender("registry"); }
  else if(m.type==="regfixed"){ endOp("registry", t("reg_fixed")+" "+m.count); }
  else if(m.type==="debloatdone"){ let msg=m.ok?t("db_done"):t("db_fail"); if(m.freedKb!=null&&m.ok)msg+=" "+fmtSize(m.freedKb); endOp("debloat", msg); }
  else if(m.type==="appxlist"){ appxData=m.data; endOp("debloat",t("st_done")); reRender("debloat"); }
  else if(m.type==="appxremoved"){ setStatus(t("db_removed")+" "+m.name); }
  else if(m.type==="log"){ logLine(m.text); }
  else if(m.type==="autoDone"){ logLine("=== "+m.text+" ==="); endOp("drivers", m.text); }
  else if(m.type==="exported"){ catStatus.drivers=t("st_reportwritten")+" "+m.path; if(cat==="drivers")setStatus(catStatus.drivers); }
  else if(m.type==="autorun"){ startOp("drivers",t("drv_scanning")); send({cmd:'scan'}); }
  else if(m.type==="nav"){ if(m.cat)cat=m.cat; if(m.sub){ if(cat==="system")sysSub=m.sub; else if(cat==="network")netSub=m.sub; else drvSub=m.sub; } go(cat); }
  else if(m.type==="lang"){ window.LANG=m.lang; applyStaticText(); render(); }
  else if(m.type==="settings"){ window.AUTOCHECK=m.autoCheck; window.AUTOUPDATE=m.autoUpdate; window.SCHEDULE=m.schedule; window.AUTORESTORE=m.autoRestore; window.HASBATTERY=(m.hasBattery!==false); applyTheme(m.theme||"auto"); if(cat==="settings")render();
    if(m.autoUpdate && !window.__autoUpdChecked){ window.__autoUpdChecked=true; updateBusy=true; send({cmd:'checkupdate'}); } }
  else if(m.type==="startup"){ if(sysData)sysData.startup=m.startup; if(cat==="system"&&sysSub==="startup")render(); }
  else if(m.type==="fullimage"){ if(m.src) showFull(m.src); else showFull("",t("dup_loadfail")); }
  else if(m.type==="wingetlog"){ ilogLine(m.text); }
  else if(m.type==="wingetdone"){ endOp("install", t("st_done")); }
  else if(m.type==="wingetsearch"){ wingetSearchData=m.data; wingetSearching=false; endOp("install", t("st_done")); if(cat==="install")render(); }
  else if(m.type==="wingetups"){ wingetUpsData=m.data; endOp("install", t("st_done")+" - "+m.data.length); if(cat==="install")render(); }
  else if(m.type==="wingetupdone"){ if(updActive){ updNext(); } else { endOp("install", t("st_done")); wingetUpsData=null; if(cat==="install"){ startOp('install',t('upd_checking')); send({cmd:'wingetups'}); render(); } } }
  else if(m.type==="wingetrunning"){ if(updActive) return;  // mid-batch: leave it listed to retry individually
    var procs=m.procs||[];
    if(procs.length){ var names=procs.map(function(p){return p.exe;}).join(", ");
      if(confirm(t('upd_running_kill').replace('{app}',m.name).replace('{proc}',names))){
        startOp('install',t('upd_updating')); send({cmd:'killretry',id:m.id,pids:procs.map(function(p){return p.pid;}).join(',')}); render(); }
    } else { alert(t('upd_running_noproc').replace('{app}',m.name)); } }
  else if(m.type==="updatecheck"){ updateBusy=false; updateData=m; if(m.newer)showUpdatePrompt(m.latest); if(cat==="settings")render(); }
  else if(m.type==="updatestatus"){ setStatus(m.phase==="download"?t("au_downloading"):t("au_installing")); }
  else if(m.type==="updatedone"){ setStatus(m.ok?t("au_restart"):t("au_failget")); }
  else if(m.type==="updatequeued"){ upClose(); setStatus(m.ok?t("au_queued"):t("au_failget")); }
  else if(m.type==="wifikeys"){ wifiData=m.data; endOp("wifi", t("st_done")); if(cat==="network")render(); }
  else if(m.type==="dnsbench"){ dnsBenchData=m.data; endOp("dnsbench", t("st_done")); if(cat==="network")render(); }
  else if(m.type==="lifecycle"){ lifeData=m; if(cat==="repair")render(); }
  else if(m.type==="repairdone"){ endOp("repair", m.ok?t("rp_done"):t("rp_fail")); }
  else if(m.type==="harden"){ hardenData=m.data; endOp("harden", t("st_done")); reRender("system"); }
  else if(m.type==="reliability"){ reliData=m; endOp("reliability", t("st_done")); reRender("system"); }
  else if(m.type==="crashes"){ crashData=m; endOp("crashes", t("st_done")); reRender("system"); }
  else if(m.type==="backupdest"){ window.BKDEST=m.folder; if(cat==="backup")render(); }
  else if(m.type==="backupstatus"){ catStatus.backup=t("bk2_running"); if(cat==="backup")setStatus(catStatus.backup); }
  else if(m.type==="backupdone"){ endOp("backup", m.ok?(t("bk2_done")+" "+(m.dest||"")):t("bk2_fail")); }
  else if(m.type==="sysreport"){ endOp("backup", m.ok?(t("rep_done")+" "+(m.path||"")):t("rep_fail")); }
  else if(m.type==="diskusage"){ duData=m.data; endOp("diskusage", t("st_done")); reRender("system"); }
  else if(m.type==="changes"){ changesData=m.data; if(cat==="system"&&sysSub==="changes")render(); }
  else if(m.type==="sensors"){ sensorsData=m.data; if(cat==="system")render(); }
  else if(m.type==="profile"){ if(m.act==="export") setStatus(m.ok?(t("prof_exported")+" "+(m.path||"")):t("prof_fail")); else setStatus(m.ok?(t("prof_imported")+" "+(m.count||0)):t("prof_none")); }
  else if(m.type==="wustatus"){ catStatus.system=t("wu_phase_"+m.phase); if(cat==="system")setStatus(catStatus.system); }
  else if(m.type==="wuinstalldone"){ const msg=m.ok?(m.reboot?t("wu_done_reboot"):t("wu_done_ok")):t("wu_done_fail"); endOp("winupdate",msg); }
  else if(m.type==="regtweaks"){ regTweaksData=m.data; if(cat==="registry")render(); }
  else if(m.type==="regbackupstatus"){ catStatus.registry=(m.phase==="restoring"?t("reg_restoring"):t("reg_backing")); if(cat==="registry")setStatus(catStatus.registry); }
  else if(m.type==="regbackupdone"){ endOp("registry", (m.ok?t("reg_backup_done"):t("db_fail"))+" "+(m.path||"")); }
  else if(m.type==="regrestoredone"){ endOp("registry", (m.ok?t("reg_restore_done"):t("db_fail"))+" "+(m.path||"")); }
});
applyStaticText(); render();
